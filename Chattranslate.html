<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Multi-Lang Chat</title>
    <style>
        :root { --primary: #075e54; --bg: #e5ddd5; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; height: 100vh; }
        
        .header { background: var(--primary); color: white; padding: 12px; text-align: center; font-weight: bold; font-size: 18px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }

        /* Language Selectors Area */
        .lang-bar { background: #fff; padding: 8px; display: flex; justify-content: space-around; border-bottom: 1px solid #ddd; font-size: 13px; }
        select { padding: 5px; border-radius: 5px; border: 1px solid #ccc; outline: none; width: 40%; }

        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        
        .bubble { max-width: 85%; padding: 10px; border-radius: 12px; position: relative; font-size: 15px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .sent { align-self: flex-end; background: #dcf8c6; border-top-right-radius: 0; }
        .received { align-self: flex-start; background: #ffffff; border-top-left-radius: 0; }
        
        .main-text { font-weight: bold; display: block; margin-bottom: 3px; }
        .trans-item { font-size: 13px; color: #444; border-top: 1px solid rgba(0,0,0,0.05); padding: 3px 0; display: flex; justify-content: space-between; align-items: center; }
        .play-btn { cursor: pointer; color: var(--primary); font-size: 14px; background: none; border: none; }

        .input-area { background: #f0f0f0; padding: 10px; display: flex; gap: 8px; align-items: center; }
        input { flex: 1; padding: 12px; border-radius: 20px; border: 1px solid #ccc; outline: none; }
        .send-btn { background: var(--primary); color: white; border: none; width: 50px; height: 50px; border-radius: 50%; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div class="header">Universal Chat Translator</div>

<!-- Language Selection Bar -->
<div class="lang-bar">
    <div>
        <strong>Aapki:</strong>
        <select id="myLang">
            <option value="hi">Hindi</option>
            <option value="en">English</option>
            <option value="ur">Urdu</option>
            <option value="bn">Bangla</option>
            <option value="ta">Tamil</option>
            <option value="ml">Malayalam</option>
        </select>
    </div>
    <div>
        <strong>Samne wale ki:</strong>
        <select id="targetLang">
            <option value="ar">Arabic</option>
            <option value="ja">Japanese</option>
            <option value="zh">Chinese</option>
            <option value="fr">French</option>
            <option value="es">Spanish</option>
            <option value="ko">Korean</option>
        </select>
    </div>
</div>

<div id="chat-box"></div>

<div class="input-area">
    <button class="send-btn" onclick="sendMsg('received')" title="Add from Left">←</button>
    <input type="text" id="msgInput" placeholder="Type message here...">
    <button class="send-btn" onclick="sendMsg('sent')" title="Add from Right">→</button>
</div>

<script>
    const chatBox = document.getElementById('chat-box');

    async function translate(text, from, to) {
        try {
            // autodetect use karne se kisi bhi language ko pehchan lega
            const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=autodetect|${to}`);
            const data = await res.json();
            return data.responseData.translatedText;
        } catch { return "Translation Error"; }
    }

    function speak(text, lang) {
        const speech = new SpeechSynthesisUtterance(text);
        speech.lang = lang;
        window.speechSynthesis.speak(speech);
    }

    async function sendMsg(side) {
        const input = document.getElementById('msgInput');
        const text = input.value.trim();
        if(!text) return;

        const myL = document.getElementById('myLang').value;
        const targetL = document.getElementById('targetLang').value;

        input.value = "Translating...";
        input.disabled = true;

        // Dono languages mein translate karega
        const trans1 = await translate(text, 'autodetect', myL);
        const trans2 = await translate(text, 'autodetect', targetL);
        const transEng = await translate(text, 'autodetect', 'en'); // Common English for both

        let html = `<div class="bubble ${side}"><span class="main-text">${text}</span>`;
        
        // Agar original text se alag hai toh hi dikhaye
        if(trans1.toLowerCase() !== text.toLowerCase())
            html += `<div class="trans-item"><span><b>Lang 1:</b> ${trans1}</span><button class="play-btn" onclick="speak('${trans1.replace(/'/g,"")}','${myL}')">🔊</button></div>`;
        
        if(trans2.toLowerCase() !== text.toLowerCase())
            html += `<div class="trans-item"><span><b>Lang 2:</b> ${trans2}</span><button class="play-btn" onclick="speak('${trans2.replace(/'/g,"")}','${targetL}')">🔊</button></div>`;

        if(transEng.toLowerCase() !== text.toLowerCase() && transEng.toLowerCase() !== trans1.toLowerCase())
            html += `<div class="trans-item"><span><b>EN:</b> ${transEng}</span><button class="play-btn" onclick="speak('${transEng.replace(/'/g,"")}','en')">🔊</button></div>`;

        html += `</div>`;
        
        chatBox.innerHTML += html;
        input.value = "";
        input.disabled = false;
        chatBox.scrollTo(0, chatBox.scrollHeight);
    }
</script>

</body>
</html>
