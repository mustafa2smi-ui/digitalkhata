<!DOCTYPE html>
<html>
<head>
<title>Store App Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {font-family: Arial; padding:10px;}
input, button, select {padding:8px; margin:5px; width:95%;}
table {width:100%; border-collapse: collapse; margin-top:10px;}
td, th {border:1px solid #ccc; padding:8px;}
tr:hover {background:#f1f1f1;}
.btn {width:auto;}
</style>
</head>

<body>

<h3>Login</h3>
<input id="email" placeholder="Enter Email">
<button onclick="login()">Login</button>

<div id="app" style="display:none;">

<h3>Product Entry</h3>

<select id="store" onchange="load()">
<option>Grocery</option>
<option>Hardware</option>
</select>

<input id="search" placeholder="🔍 Search Item" onkeyup="load()">

<input id="hindi" placeholder="Hindi Name">
<input id="english" placeholder="English Name">
<input id="category" placeholder="Category">
<input id="wholesale" placeholder="Wholesale">
<input id="retail" placeholder="Retail">
<input id="unit" placeholder="Unit">
<input id="code" placeholder="Code">

<button onclick="add()">Add Item</button>

<hr>

<h3>Table</h3>
<table id="table"></table>

<hr>

<h3>Billing</h3>
<button onclick="clearBill()">🧹 Clear Bill</button>
<button onclick="shareBill()">📤 Share</button>
<button onclick="savePDF()">📄 PDF</button>

<table id="bill"></table>

<h3>Saved Bills (Local)</h3>
<table id="history"></table>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
const API = "https://script.google.com/macros/s/AKfycbwZ_8t9ciX3a_9ix2WTW76gKhnBuReWsDsJGczWv_L6LIDoIbXElt00_xDCuX04MHA/exec";

let device = localStorage.getItem("device") || Date.now();
localStorage.setItem("device", device);

let selectedRow = null;

function login(){
let email = document.getElementById("email").value;

fetch(API + "?action=login&email="+email+"&device="+device)
.then(r=>r.text())
.then(res=>{
if(res=="SUCCESS"){
app.style.display="block";
load();
}else alert(res);
});
}

// ADD ITEM
function add(){
let data={
action:"add",
store:store.value,
hindi:hindi.value,
english:english.value,
category:category.value,
wholesale:wholesale.value,
retail:retail.value,
unit:unit.value,
code:code.value
};

fetch(API,{
method:"POST",
body:JSON.stringify(data)
}).then(()=>load());
}

// LOAD TABLE + SEARCH
function load(){
fetch(API+"?action=getData&store="+store.value)
.then(r=>r.json())
.then(data=>{
let s=search.value.toLowerCase();

let html="<tr><th>Name</th><th>Action</th></tr>";

data.forEach((row,i)=>{
if(i==0)return;

if(row[2].toLowerCase().includes(s)){
html+=`<tr>
<td onclick="addBill('${row[2]}',${row[5]})">${row[2]}</td>
<td>
<button onclick="editRow(${i},'${row[2]}')">✏️</button>
<button onclick="deleteRow(${i})">🗑</button>
</td>
</tr>`;
}
});

table.innerHTML=html;
});
}

// DELETE
function deleteRow(r){
fetch(API,{
method:"POST",
body:JSON.stringify({action:"delete",store:store.value,row:r+1})
}).then(()=>load());
}

// EDIT
function editRow(r,name){
selectedRow=r;
english.value=name;
}

// UPDATE
function update(){
let data={
action:"update",
store:store.value,
row:selectedRow+1,
hindi:hindi.value,
english:english.value,
category:category.value,
wholesale:wholesale.value,
retail:retail.value,
unit:unit.value,
code:code.value
};

fetch(API,{
method:"POST",
body:JSON.stringify(data)
}).then(()=>load());
}

// BILL
let bill=[];

function addBill(name,price){
bill.push({name,price,qty:1});
renderBill();
saveLocal();
}

function renderBill(){
let html="<tr><th>Item</th><th>Qty</th><th>Amt</th><th>Action</th></tr>";

bill.forEach((i,index)=>{
html+=`<tr>
<td>${i.name}</td>
<td><input value="${i.qty}" onchange="changeQty(${index},this.value)"></td>
<td>${i.qty*i.price}</td>
<td>
<button onclick="removeItem(${index})">❌</button>
</td>
</tr>`;
});

bill.innerHTML=html;
}

function changeQty(i,q){
bill[i].qty=q;
renderBill();
saveLocal();
}

function removeItem(i){
bill.splice(i,1);
renderBill();
saveLocal();
}

// CLEAR BILL
function clearBill(){
bill=[];
renderBill();
}

// SHARE
function shareBill(){
let text="Bill:\n";
bill.forEach(i=>{
text+=i.name+" x"+i.qty+" = "+(i.qty*i.price)+"\n";
});

navigator.share ? navigator.share({text}) : alert(text);
}

// PDF
function savePDF(){
const { jsPDF } = window.jspdf;
let doc=new jsPDF();

let y=10;
bill.forEach(i=>{
doc.text(i.name+" x"+i.qty+" = "+(i.qty*i.price),10,y);
y+=10;
});

doc.save("bill.pdf");
}

// LOCAL STORAGE
function saveLocal(){
localStorage.setItem("bill",JSON.stringify(bill));
loadHistory();
}

function loadHistory(){
let data=JSON.parse(localStorage.getItem("bill")||"[]");

let html="<tr><th>Saved Bill</th></tr>";

html+=`<tr onclick='loadSaved()'><td>Last Bill (Click to Edit)</td></tr>`;

history.innerHTML=html;
}

function loadSaved(){
bill=JSON.parse(localStorage.getItem("bill")||"[]");
renderBill();
}

loadHistory();

</script>

</body>
</html>
