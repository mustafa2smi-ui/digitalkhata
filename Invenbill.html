
<!DOCTYPE html>
<html>
<head>
<title>Store App Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
body {font-family: Arial; padding:10px;}
input, button, select {padding:8px; margin:5px; width:95%;}
table {width:100%; border-collapse: collapse; margin-top:10px;}
td, th {border:1px solid #ccc; padding:8px;}
tr:hover {background:#f1f1f1;}
  h3 {
background:#4CAF50;
color:white;
padding:8px;
border-radius:5px;
}

button {
background:#2196F3;
color:white;
border:none;
border-radius:5px;
}

button:hover {
background:#0b7dda;
}
  #calcBox {
border:2px solid #00ffcc;
padding:10px;
border-radius:10px;
box-shadow:0 0 10px #00ffcc;
}

#calcInput {
font-size:18px;
color:#0ff;
background:black;
border:none;
outline:none;
}

.operator { color: orange; }
.number { color: cyan; }
  #calcContainer {
border:2px solid #00ffcc;
border-radius:10px;
padding:10px;
box-shadow:0 0 15px #00ffcc;
background:black;
}

#calcDisplay {
width:100%;
font-size:22px;
padding:10px;
margin-bottom:10px;
background:#000;
color:#0ff;
border:none;
outline:none;
}

.calcGrid {
display:grid;
grid-template-columns: repeat(4, 1fr);
gap:8px;
}

.calcGrid button {
padding:15px;
font-size:18px;
border:none;
border-radius:8px;
background:#111;
color:#0ff;
box-shadow:0 0 5px #0ff;
}

.calcGrid .op {
color:orange;
box-shadow:0 0 5px orange;
}

.calcGrid .equal {
grid-column: span 4;
background:#00ffcc;
color:black;
font-weight:bold;
}
</style>
</head>

<body>

<h3>Login</h3>
<input id="email" placeholder="Enter Email">
<button onclick="login()">Login</button>

<div id="app" style="display:none;">
<h3>📷 Barcode Scanner</h3>

<select id="scanMode">
  <option value="bill">Billing Mode</option>
  <option value="save">Save Mode</option>
</select>
<h3>📷 Camera Scanner</h3>

<button onclick="startScanner()">▶ Start Scan</button>
<button onclick="stopScanner()">⛔ Stop</button>

<div id="reader" style="width:300px;"></div>
<input id="barcodeInput" placeholder="Scan or Enter Code" oninput="handleScan()">
<h3>Product Entry</h3>

<select id="store" onchange="load()">
<option>Grocery</option>
<option>Hardware</option>
</select>

<input id="search" placeholder="🔍 Search Item" onkeyup="load()">

<input id="hindi" placeholder="Hindi Name">
<input id="english" placeholder="English Name">
<input id="category" placeholder="Category">
<input id="wholesale" placeholder="Wholesale">
<input id="retail" placeholder="Retail">
<input id="unit" placeholder="Unit">
<input id="code" placeholder="Code">

<button onclick="add()">Add Item</button>
<button onclick="update()">Update Item</button>

<hr>

<h3>View Data</h3>

<select id="storeTop" onchange="changeStore()">
<option value="Grocery">Grocery</option>
<option value="Hardware">Hardware</option>
</select>

<select id="priceType">
<option value="retail">Retail</option>
<option value="wholesale">Wholesale</option>
</select>

<h3>Table</h3>
<table id="table"></table>

<hr>
<h3>🧾 Bill Details</h3>

<input id="shopName" placeholder="Shop Name">
<input id="custName" placeholder="Customer Name">

<div id="billDate"></div>
<h3>Billing</h3>
<button onclick="clearBill()">🧹 Clear</button>
<button onclick="shareBill()">📤 Share</button>
<button onclick="savePDF()">📄 PDF</button>
<button onclick="printBill()">🖨️ Print</button>
<table id="bill"></table>
<h3>Payment</h3>

<input id="prevBal" placeholder="Previous Balance" type="number">
<input id="todayPaid" placeholder="Today Paid" type="number">

<h3 id="grandTotal"></h3>
<h3>Saved Bill</h3>
<table id="history"></table>

</div>
<h3>🧮 Smart Calculator</h3>

<div id="calcBox">
  <input id="calcInput" placeholder="Enter calculation (e.g. 24+24)">
  <button onclick="calculate()">=</button>
</div>
  <h3>🧮 Calculator</h3>

<div id="calcContainer">

<input id="calcDisplay" readonly>

<div class="calcGrid">

<button onclick="press('7')">7</button>
<button onclick="press('8')">8</button>
<button onclick="press('9')">9</button>
<button class="op" onclick="press('/')">÷</button>

<button onclick="press('4')">4</button>
<button onclick="press('5')">5</button>
<button onclick="press('6')">6</button>
<button class="op" onclick="press('*')">×</button>

<button onclick="press('1')">1</button>
<button onclick="press('2')">2</button>
<button onclick="press('3')">3</button>
<button class="op" onclick="press('-')">−</button>

<button onclick="press('0')">0</button>
<button onclick="press('.')">.</button>
<button onclick="clearCalc()">C</button>
<button class="op" onclick="press('+')">+</button>

<button class="equal" onclick="calculate()">=</button>

</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
const API = "https://script.google.com/macros/s/AKfycbwZ_8t9ciX3a_9ix2WTW76gKhnBuReWsDsJGczWv_L6LIDoIbXElt00_xDCuX04MHA/exec";

let device = localStorage.getItem("device") || Date.now();
localStorage.setItem("device", device);

let selectedRow = null;
let bill = [];
let scanner;
let calcCount = 1;
let calcExp = "";
let calcCount = 1;

// button press
function press(val){
calcExp += val;
document.getElementById("calcDisplay").value = calcExp;
}

// clear
function clearCalc(){
calcExp = "";
document.getElementById("calcDisplay").value = "";
}

// calculate
function calculate(){

if(!calcExp) return;

try{

let result = eval(calcExp);

// 🧠 bill में add
let itemName = "Item" + calcCount++;

bill.push({
name: itemName + " (" + calcExp + ")",
price: result,
qty: 1
});

renderBill();
saveLocal();

// reset
calcExp = "";
document.getElementById("calcDisplay").value = "";

}catch{
alert("Invalid Calculation");
}
}
function calculate(){

let exp = document.getElementById("calcInput").value;

if(!exp) return;

try{

// SAFE CALCULATION
let result = eval(exp);

// item name auto
let itemName = "Item" + calcCount++;

// bill में add
bill.push({
name: itemName + " (" + exp + ")",
price: result,
qty: 1
});

renderBill();
saveLocal();

document.getElementById("calcInput").value="";

}catch(e){
alert("Invalid calculation");
}

}
function startScanner(){

scanner = new Html5Qrcode("reader");

Html5Qrcode.getCameras().then(devices => {

if (devices && devices.length) {

scanner.start(
devices[0].id,
{
fps: 10,
qrbox: 250
},
(decodedText) => {

handleScanResult(decodedText);

},
(errorMessage) => {
// ignore errors
}
);

}
});

}

function stopScanner(){
if(scanner){
scanner.stop();
}
}
// LOGIN
function login(){
let email = document.getElementById("email").value;

fetch(API + "?action=login&email="+email+"&device="+device)
.then(r=>r.text())
.then(res=>{
if(res=="SUCCESS"){
document.getElementById("app").style.display="block";
load();
}else alert(res);
});
}
  function searchByCode(code){

fetch(API+"?action=getData&store="+store.value)
.then(r=>r.json())
.then(data=>{

let found = false;

data.forEach((row,i)=>{
if(i==0) return;

if(row[7] == code){

addBill(row[2], row[5], row[4]); // name, retail, wholesale
found = true;
}
});

if(!found){
alert("❌ Item not found");
}

});
}
function handleScan(){

let code = document.getElementById("barcodeInput").value.trim();
if(code.length < 3) return;

let mode = document.getElementById("scanMode").value;

if(mode === "save"){
  document.getElementById("code").value = code;
  alert("Code filled for saving item");
}

if(mode === "bill"){
  searchByCode(code);
}

document.getElementById("barcodeInput").value="";
}
  function handleScanResult(code){

let mode = document.getElementById("scanMode").value;

// 🔊 beep sound
let beep = new Audio("https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg");
beep.play();

if(mode === "save"){
document.getElementById("code").value = code;
alert("✅ Code filled");
}

if(mode === "bill"){
searchByCode(code);
}
}
// ADD
function add(){
let data={
action:"add",
store:store.value,
hindi:hindi.value,
english:english.value,
category:category.value,
wholesale:wholesale.value,
retail:retail.value,
unit:unit.value,
code:code.value
};

fetch(API,{
method:"POST",
body:JSON.stringify(data)
}).then(()=>{
load();
clearForm();
});
}

// CLEAR FORM
function clearForm(){
hindi.value="";
english.value="";
category.value="";
wholesale.value="";
retail.value="";
unit.value="";
code.value="";
selectedRow=null;
}

// LOAD DATA
function load(){
fetch(API+"?action=getData&store="+store.value)
.then(r=>r.json())
.then(data=>{
let s=search.value.toLowerCase();

let html = `
<tr>
<th>Name</th>
<th>Wholesale</th>
<th>Retail</th>
<th>Action</th>
</tr>`;

data.forEach((row,i)=>{
if(i==0)return;

if(row[2] && row[2].toLowerCase().includes(s)){
html+=`<tr onclick="addBill('${row[2]}','${row[5]}','${row[4]}')">
<td>${row[2]}</td>
<td>${row[4]}</td>
<td>${row[5]}</td>
<td>
<button onclick="event.stopPropagation();editRow(${i},'${row[2]}','${row[1]}','${row[3]}','${row[4]}','${row[5]}','${row[6]}','${row[7]}')">✏️</button>
<button onclick="event.stopPropagation();deleteRow(${i})">🗑</button>
</td>
</tr>`;
}
});

document.getElementById("table").innerHTML=html;
});
}

// CHANGE STORE
function changeStore(){
store.value = storeTop.value;
load();
}

// DELETE
function deleteRow(r){
fetch(API,{
method:"POST",
body:JSON.stringify({action:"delete",store:store.value,row:r+1})
}).then(()=>load());
}

// EDIT
function editRow(r,en,hi,cat,wh,rt,un,cd){
selectedRow=r;
english.value=en;
hindi.value=hi;
category.value=cat;
wholesale.value=wh;
retail.value=rt;
unit.value=un;
code.value=cd;
}

// UPDATE
function update(){
if(selectedRow==null){alert("Select item first");return;}

let data={
action:"update",
store:store.value,
row:selectedRow+1,
hindi:hindi.value,
english:english.value,
category:category.value,
wholesale:wholesale.value,
retail:retail.value,
unit:unit.value,
code:code.value
};

fetch(API,{
method:"POST",
body:JSON.stringify(data)
}).then(()=>{
load();
clearForm();
});
}

wholesale = Number(wholesale) || 0;

let type = document.getElementById("priceType").value;
let price = (type === "retail") ? retail : wholesale;

// 🧠 SAME ITEM MERGE
let existing = bill.find(i=>i.name===name);

if(existing){
existing.qty++;
}else{
bill.push({name, price, qty:1});
}

renderBill();
saveLocal();
}

  function renderBill(){

let html=`
<tr>
<th>#</th>
<th>Item</th>
<th>Qty</th>
<th>Rate</th>
<th>Amount</th>
<th>❌</th>
</tr>`;

let total=0;

bill.forEach((i,index)=>{
let amt = i.qty * i.price;
total += amt;

html+=`
<tr>
<td>${index+1}</td>
<td>${i.name}</td>
<td>
<button onclick="changeQty(${index},-1)">➖</button>
${i.qty}
<button onclick="changeQty(${index},1)">➕</button>
</td>
<td>${i.price}</td>
<td>${amt}</td>
<td><button onclick="removeItem(${index})">❌</button></td>
</tr>`;
});

html+=`
<tr style="background:#dff0d8;font-weight:bold;">
<td colspan="4">Total</td>
<td>${total}</td>
<td></td>
</tr>`;

document.getElementById("bill").innerHTML = html;
}
// QTY CHANGE
function changeQty(i,delta){
bill[i].qty += delta;
if(bill[i].qty<=0) bill.splice(i,1);
renderBill();
saveLocal();
}
function getTotal(){
let total=0;
bill.forEach(i=>{
total += i.qty * i.price;
});
return total;
}

function updateGrand(){
let prev = Number(document.getElementById("prevBal").value) || 0;
let paid = Number(document.getElementById("todayPaid").value) || 0;

let grand = prev + getTotal() - paid;

document.getElementById("grandTotal").innerHTML =
"Grand Total: ₹ " + grand;
}
// REMOVE
function removeItem(i){
bill.splice(i,1);
renderBill();
saveLocal();
}

// CLEAR BILL
function clearBill(){
bill=[];
renderBill();
saveLocal();
}

// SHARE
function shareBill(){
let text = "🧾 BILL\n\n";

bill.forEach(i=>{
text += i.name+" x"+i.qty+" = "+(i.qty*i.price)+"\n";
});

text += "\nTotal: " + getTotal();

let url = "https://wa.me/?text=" + encodeURIComponent(text);
window.open(url, "_blank");
}

// PDF
function savePDF(){
const { jsPDF } = window.jspdf;
let doc=new jsPDF();

let y=10;
bill.forEach(i=>{
doc.text(i.name+" x"+i.qty+" = "+(i.qty*i.price),10,y);
y+=10;
});

doc.save("bill.pdf");
}
function printBill(){

let content = `
<h2>${shopName.value}</h2>
<p>Customer: ${custName.value}</p>
<p>Date: ${new Date().toLocaleDateString()}</p>
<hr>`;

bill.forEach(i=>{
content += `<p>${i.name} x${i.qty} = ${i.qty*i.price}</p>`;
});

content += `<hr><h3>Total: ${getTotal()}</h3>`;

let w = window.open("", "", "width=300");
w.document.write(content);
w.print();
}
// LOCAL SAVE
function saveLocal(){
localStorage.setItem("bill",JSON.stringify(bill));
loadHistory();
}

function loadHistory(){
let html="<tr><th>Saved Bill</th></tr>";
html+=`<tr onclick='loadSaved()'><td>Click to Load</td></tr>`;
document.getElementById("history").innerHTML=html;
}

function loadSaved(){
bill=JSON.parse(localStorage.getItem("bill")||"[]");
renderBill();
}

loadHistory();
</script>

</body>
</html>
