<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Jodi Milao Pro</title>
    <style>
        :root { --p: #4a90e2; --s: #2ecc71; --d: #e74c3c; --bg: #f4f7f6; }
        body { font-family: sans-serif; margin: 0; background: var(--bg); padding-top: 65px; padding-bottom: 50px; }
        
        /* Header Fix */
        header { position: fixed; top: 0; width: 100%; height: 60px; background: white; display: flex; 
                 align-items: center; justify-content: space-between; padding: 0 15px; box-shadow: 0 2px 5px #0002; z-index: 100; box-sizing: border-box;}
        
        #clock { background: #333; color: #0f0; padding: 5px 10px; border-radius: 5px; font-family: monospace; }

        /* Homepage Grid */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 15px; }
        .card { background: white; padding: 30px 10px; border-radius: 15px; text-align: center; 
                box-shadow: 0 4px 10px #0001; position: relative; cursor: pointer; }
        .badge { position: absolute; bottom: -10px; left: 20%; width: 60%; background: #f1c40f; 
                 font-size: 11px; font-weight: bold; border-radius: 10px; padding: 3px 0; }

        /* Game Board */
        .game-area { display: none; padding: 10px; }
        .board { position: relative; display: flex; justify-content: space-between; width: 100%; max-width: 400px; margin: auto; height: 500px; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; touch-action: none; }
        .col { display: flex; flex-direction: column; gap: 10px; z-index: 2; }
        
        /* Box & Image Loader */
        .box { width: 85px; height: 85px; background: white; border: 2px solid #ddd; border-radius: 12px; 
               display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .box img { width: 45px; height: 45px; object-fit: contain; }
        .sub-text { font-size: 10px; color: #888; opacity: 0.8; margin-top: 4px; }
        .word-box { width: 100px; font-weight: bold; font-size: 13px; }

        footer { position: fixed; bottom: 0; width: 100%; background: #eee; text-align: center; font-size: 10px; padding: 5px; }
    </style>
</head>
<body>

<header>
    <div onclick="showHome()" style="font-size:20px">🏠</div>
    <select id="catSelect" onchange="renderHome()" style="padding:5px; border-radius:5px;"></select>
    <div id="clock">00:00</div>
</header>

<div id="home-page" class="grid"></div>

<div id="game-page" class="game-area">
    <div id="status" style="text-align:center; margin-bottom:10px; font-weight:bold;">Jodi Milaiye!</div>
    <div class="board" id="board">
        <canvas id="canvas"></canvas>
        <div class="col" id="left-side"></div>
        <div class="col" id="right-side"></div>
    </div>
</div>

<footer>Design & Developed for Retail Shops | 2026</footer>

<script src="questions.js"></script>

<script>
    let currentCat = "Science";
    let activeLevel = null;
    let startTime, isDrawing = false, lines = [], startPt = null;
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // 1. Automated Image/Emoji Loader
    function getContent(item) {
        let content = "";
        if (item.q.includes('.') || item.q.startsWith('http')) {
            content = `<img src="${item.q}" alt="icon">`;
        } else {
            content = `<span style="font-size:2rem">${item.q}</span>`;
        }
        return `${content} <div class="sub-text">(${item.sub})</div>`;
    }

    // 2. Render Homepage
    function renderHome() {
        const catSelect = document.getElementById('catSelect');
        if(catSelect.options.length === 0) {
            Object.keys(gameData).forEach(c => catSelect.innerHTML += `<option value="${c}">${c}</option>`);
        }
        currentCat = catSelect.value;
        const home = document.getElementById('home-page');
        home.innerHTML = '';
        
        gameData[currentCat].forEach(lvl => {
            const score = localStorage.getItem(`score_${currentCat}_${lvl.level}`) || 0;
            home.innerHTML += `
                <div class="card" onclick="startLevel(${lvl.level})">
                    Level ${lvl.level}
                    <div class="badge">Best: ${score}</div>
                </div>`;
        });
        document.getElementById('game-page').style.display = 'none';
        home.style.display = 'grid';
    }

    // 3. Start Game
    function startLevel(lvlId) {
        activeLevel = gameData[currentCat].find(l => l.level === lvlId);
        document.getElementById('home-page').style.display = 'none';
        document.getElementById('game-page').style.display = 'block';
        
        const left = document.getElementById('left-side');
        const right = document.getElementById('right-side');
        left.innerHTML = ''; right.innerHTML = '';
        lines = [];
        startTime = Date.now();

        const shuffled = [...activeLevel.pairs].sort(() => Math.random() - 0.5);
        activeLevel.pairs.forEach((p, i) => {
            left.innerHTML += `<div class="box" id="L${i}" data-ans="${p.a}">${getContent(p)}</div>`;
            right.innerHTML += `<div class="box word-box" id="R${i}" data-ans="${shuffled[i].a}">${shuffled[i].a}</div>`;
        });

        setTimeout(resize, 100);
    }

    // Drawing logic (Same as previous but with resize support)
    function resize() {
        const b = document.getElementById('board');
        canvas.width = b.clientWidth; canvas.height = b.clientHeight;
        draw();
    }

    canvas.addEventListener('touchstart', e => {
        const r = canvas.getBoundingClientRect();
        const x = e.touches[0].clientX - r.left;
        const y = e.touches[0].clientY - r.top;
        document.querySelectorAll('#left-side .box').forEach(el => {
            const boxR = el.getBoundingClientRect();
            if (y > boxR.top - r.top && y < boxR.bottom - r.top) {
                isDrawing = true;
                startPt = { x: boxR.right - r.left, y: boxR.top + boxR.height/2 - r.top, ans: el.dataset.ans };
            }
        });
    });

    canvas.addEventListener('touchmove', e => {
        if(!isDrawing) return;
        draw();
        const r = canvas.getBoundingClientRect();
        ctx.beginPath(); ctx.moveTo(startPt.x, startPt.y);
        ctx.lineTo(e.touches[0].clientX - r.left, e.touches[0].clientY - r.top);
        ctx.strokeStyle = '#4a90e2'; ctx.lineWidth = 3; ctx.stroke();
    });

    canvas.addEventListener('touchend', e => {
        if(!isDrawing) return;
        const r = canvas.getBoundingClientRect();
        const x = e.changedTouches[0].clientX - r.left;
        const y = e.changedTouches[0].clientY - r.top;
        document.querySelectorAll('#right-side .box').forEach(el => {
            const boxR = el.getBoundingClientRect();
            if (x > boxR.left - r.left && y > boxR.top - r.top && y < boxR.bottom - r.top) {
                if(!lines.find(l => l.ans === startPt.ans)) {
                    lines.push({ ans: startPt.ans, target: el.dataset.ans, x1: startPt.x, y1: startPt.y, x2: boxR.left - r.left, y2: boxR.top + boxR.height/2 - r.top });
                }
            }
        });
        isDrawing = false; draw();
        if(lines.length === activeLevel.pairs.length) finalize();
    });

    function draw(colored = false) {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        lines.forEach(l => {
            ctx.beginPath(); ctx.moveTo(l.x1, l.y1); ctx.lineTo(l.x2, l.y2);
            ctx.strokeStyle = colored ? (l.ans === l.target ? '#2ecc71' : '#e74c3c') : '#4a90e2';
            ctx.lineWidth = 4; ctx.stroke();
        });
    }

    function finalize() {
        draw(true);
        const correct = lines.filter(l => l.ans === l.target).length;
        const time = Math.floor((Date.now() - startTime)/1000);
        const score = (correct * 100) + Math.max(0, 500 - (time*2));
        
        localStorage.setItem(`score_${currentCat}_${activeLevel.level}`, score);
        document.getElementById('status').innerHTML = `Sahi: ${correct} | Score: ${score} <br> <button onclick="renderHome()">Continue</button>`;
    }

    function showHome() { renderHome(); }
    setInterval(() => {
        if(startTime) {
            const diff = Math.floor((Date.now() - startTime)/1000);
            document.getElementById('clock').innerText = `${Math.floor(diff/60).toString().padStart(2,'0')}:${(diff%60).toString().padStart(2,'0')}`;
        }
    }, 1000);

    window.onload = renderHome;
</script>
</body>
</html>
