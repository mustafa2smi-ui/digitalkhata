        .numpad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
        .n-btn { height: 45px; font-size: 18px; border-radius: 8px; border: none; background: #f1f5f9; font-weight: bold; color: #334155; }
        .n-btn:active { background: #cbd5e1; }

        .settings-drawer { position: fixed; top: 0; right: -100%; width: 85%; max-width: 320px; height: 100dvh; background: #fff; z-index: 10001; transition: 0.3s; padding: 20px; box-shadow: -5px 0 20px rgba(0,0,0,0.1); overflow-y: auto; }
        .settings-drawer.open { right: 0; }

<script>
    let editIndex = null; // Track karne ke liye ki kaunsa item edit ho raha hai
let items = [], myInventory = JSON.parse(localStorage.getItem('myInventory')) || [];
let currentFocus = "itemQty"; // Default focus is Qty

// Initially focus Qty
document.getElementById('itemQty').focus();

// Focus management - Block keyboard but keep our internal focus
document.querySelectorAll('.entry-grid input').forEach(inp => {
    inp.addEventListener('click', (e) => {
        currentFocus = e.target.id;
        // If it's Item Name, let mobile keyboard open naturally
    });
});

function press(v) {
    let input = document.getElementById(currentFocus);
    if(currentFocus === "itemName") return; // Keypad doesn't type in Name
    input.value += v;
}

function back() {
    let input = document.getElementById(currentFocus);
    input.value = input.value.slice(0, -1);
}

function clearAll() {
    if(confirm("New Bill?")) {
        items = [];
        updateDisplay();
        resetInputs();
    }
}

function resetInputs() {
    document.getElementById('itemName').value = "";
    document.getElementById('itemQty').value = "";
    document.getElementById('itemRate').value = "";
    document.getElementById('itemQty').focus();
    currentFocus = "itemQty";
}

// Logic for '*' Key
function handleStar() {
    const qty = document.getElementById('itemQty');
    const rate = document.getElementById('itemRate');
    const name = document.getElementById('itemName');

    if (currentFocus === "itemQty") {
        if(qty.value === "") qty.value = "1";
        currentFocus = "itemRate";
        rate.focus();
    } 
    else if (currentFocus === "itemRate") {
        if (rate.value !== "") {
            addItemToList();
        }
    }
    else if (currentFocus === "itemName") {
        currentFocus = "itemQty";
        qty.focus();
    }
}

function addItemToList() {
    const n = document.getElementById('itemName').value || "General Item";
    const q = parseFloat(document.getElementById('itemQty').value) || 1;
    const r = parseFloat(document.getElementById('itemRate').value) || 0;

    if (r > 0) {
        let newItem = { name: n, qty: q, rate: r, total: q * r };
        
        if (editIndex !== null) {
            // Agar edit mode tha, toh usi position par update karo
            items[editIndex] = newItem;
            editIndex = null; // Reset edit mode
        } else {
            // Naya item hai toh niche jodo
            items.push(newItem);
        }
        
        updateDisplay();
        resetInputs();
    }
}

function updateDisplay() {
    const list = document.getElementById('items-list');
    list.innerHTML = items.map((it, index) => `
        <div class="item-row" onclick="editItem(${index})">
            <div><b>${it.name}</b><br><small>${it.qty} x ${it.rate}</small></div>
            <div>₹${it.total.toFixed(2)}</div>
        </div>`).join('');
    
    let grand = items.reduce((a, b) => a + b.total, 0);
    document.getElementById('final-total').innerText = "₹ " + grand.toFixed(2);
}

// Edit Mode Function
function editItem(index) {
    const it = items[index];
    document.getElementById('itemName').value = it.name;
    document.getElementById('itemQty').value = it.qty;
    document.getElementById('itemRate').value = it.rate;
    
    editIndex = index; // Index ko save kar liya
    
    currentFocus = "itemQty";
    document.getElementById('itemQty').focus();
    // Is baar hum splice nahi karenge, sirf UI mein highlight kar sakte hain
}


// Scanner Logic
async function startScanner() {
    document.getElementById('scanner-overlay').style.display = 'flex';
    const video = document.getElementById('video');
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = stream;
        const detector = new BarcodeDetector();
        const scan = async () => {
            const codes = await detector.detect(video);
            if (codes.length > 0) {
                let code = codes[0].rawValue;
                stopScanner();
                let match = myInventory.find(it => it.barcode === code);
                if (match) {
                    document.getElementById('itemName').value = match.name;
                    document.getElementById('itemRate').value = match.price;
                    document.getElementById('itemQty').focus();
                    currentFocus = "itemQty";
                }
                return;
            }
            if(document.getElementById('scanner-overlay').style.display === 'flex') requestAnimationFrame(scan);
        };
        scan();
    } catch (e) { stopScanner(); }
}

function stopScanner() {
    const video = document.getElementById('video');
    if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
    document.getElementById('scanner-overlay').style.display = 'none';
}

/*function saveBill() { alert("Bill Saved!"); /* Previous screenshot code */ }*/
function printThermal() { alert("Printing..."); /* Previous Bluetooth code */ }
function startClock() {
    setInterval(() => {
        const now = new Date();
        const dateStr = now.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' });
        const timeStr = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        document.getElementById('liveClock').innerHTML = `${dateStr}<br>${timeStr}`;
    }, 1000);
}
let savedBillsHistory = JSON.parse(localStorage.getItem('savedBillsHistory')) || [];

function saveBill() {
    if (items.length === 0) return alert("Bill khali hai!");

    const custName = document.getElementById('custName').value || "Cash_Customer";
    const date = new Date().toLocaleDateString().replace(/\//g, '-');
    const fileName = `Bill_${custName}_${date}.csv`;

    // 1. CSV Data Taiyar karna
    let csvContent = "Item Name,Quantity,Rate,Total\n"; // Header
    items.forEach(it => {
        csvContent += `${it.name},${it.qty},${it.rate},${it.total}\n`;
    });
    
    let grandTotal = items.reduce((a, b) => a + b.total, 0);
    csvContent += `\n,,,GRAND TOTAL,${grandTotal}`;

    // 2. CSV File Download karna
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    const url = URL.createObjectURL(blob);
    link.setAttribute("href", url);
    link.setAttribute("download", fileName);
    link.style.visibility = 'hidden';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    // 3. History mein save karna (sirf record ke liye)
    const billRecord = {
        name: custName,
        total: grandTotal,
        date: new Date().toLocaleString(),
        itemCount: items.length
    };
    savedBillsHistory.unshift(billRecord); // Naya bill upar dikhega
    if(savedBillsHistory.length > 10) savedBillsHistory.pop(); // Sirf last 10 bills rakhein
    localStorage.setItem('savedBillsHistory', JSON.stringify(savedBillsHistory));
    
    updateGallery();
    alert("CSV File Saved & Downloaded!");
}

function updateGallery() {
    const gallery = document.getElementById('billGallery');
    gallery.innerHTML = savedBillsHistory.map(bill => `
        <div style="padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; background: #f8fafc;">
            <div>
                <b style="font-size: 13px;">${bill.name}</b><br>
                <small style="color: #64748b;">${bill.date} | ${bill.itemCount} Items</small>
            </div>
            <b style="color: #059669;">₹${bill.total.toFixed(2)}</b>
        </div>
    `).join('');
}

// Window load par gallery refresh karein
window.onload = () => {
    updateGallery();
    startClock();
};

// Ise window load ya goToCalc ke andar call karein
/* startClock();*/
function addToInventory() {
    let name = document.getElementById('itemName').value;
    if(!name || !currentExp) return alert("Fill item name and rate first!");
    myInventory.push({ name, price: currentExp, gst: document.getElementById('itemGst').value, disc: document.getElementById('itemDisc').value });
    localStorage.setItem('myInventory', JSON.stringify(myInventory));
    loadInventory(); alert("Saved to List!");
}

// External Features
function quickTextShare() {
    let t = `*Digital Bill*\nName: ${document.getElementById('custName').value}\nItems: ${items.length}\n*Total: ${document.getElementById('final-baki').innerText}*`;
    window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(t)}`);
}
function shareWebsite() { window.open(`https://api.whatsapp.com/send?text=${window.location.href}`); }
function exportToCSV() {
    let c = "Item,Price\n" + items.map(i => `${i.name},${i.price}`).join("\n");
    let l = document.createElement('a'); l.href = 'data:text/csv;charset=utf-8,' + encodeURI(c); l.download = 'Bill.csv'; l.click();
}
function exportInventory() {
    let d = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(myInventory));
    let l = document.createElement('a'); l.href = d; l.download = "Inventory_Backup.json"; l.click();
}
function importInventory(input) {
    let r = new FileReader();
    r.onload = () => { myInventory = JSON.parse(r.result); localStorage.setItem('myInventory', JSON.stringify(myInventory)); loadInventory(); alert("Restored!"); };
    r.readAsText(input.files[0]);
}

// Click outside to close drawer
document.addEventListener('click', (e) => {
    const d = document.getElementById('settingsDrawer');
    if(!d.contains(e.target) && !e.target.classList.contains('fa-cog') && d.classList.contains('open')) d.classList.remove('open');
});
    function renderGallery() {
    const grid = document.getElementById('gallery-grid');
    const bills = JSON.parse(localStorage.getItem('myBills') || "[]");
    grid.innerHTML = bills.length === 0 ? "<p style='grid-column:span 2; text-align:center; font-size:12px; color:#999;'>No history</p>" : "";
    
    bills.forEach((b, i) => {
        grid.innerHTML += `
            <div class="gallery-item">
                <img src="${b.image}" style="width:100%; height:70px; object-fit:cover;">
                <div style="padding:5px; font-size:10px;"><b>${b.name}</b><br>${b.total}</div>
                <div class="gallery-controls">
                    <i class="fas fa-print" onclick="window.open('${b.image}')"></i>
                    <i class="fas fa-trash-alt" style="color:red;" onclick="deleteHistory(${i})"></i>
                </div>
            </div>`;
    });
}

function deleteHistory(i) {
    let bills = JSON.parse(localStorage.getItem('myBills') || "[]");
    bills.splice(i, 1);
    localStorage.setItem('myBills', JSON.stringify(bills));
    renderGallery();
}

// Inventory Logic
function toggleSettings() {
    const d = document.getElementById('settingsDrawer');
    d.classList.toggle('open');
    if(d.classList.contains('open')) renderFullInventory();
}

function renderFullInventory() {
    const container = document.getElementById('full-inventory-list');
    container.innerHTML = myInventory.length === 0 ? "<p style='font-size:12px;'>Empty</p>" : "";
    myInventory.forEach((it, i) => {
        container.innerHTML += `<div class="manage-item-row">
            <span><b>${it.name}</b> (₹${it.price})</span>
            <i class="fas fa-trash" style="color:red;" onclick="myInventory.splice(${i},1);localStorage.setItem('myInventory', JSON.stringify(myInventory));renderFullInventory();loadInventory();"></i>
        </div>`;
    });
}
    // --- Smart Barcode Offline Scanner ---
async function startScanner() {
    document.getElementById('scanner-overlay').style.display = 'flex';
    const video = document.getElementById('video');
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = stream;
        video.play();
        scannerActive = true;
        scanFrame();
    } catch (err) { alert("Camera Error!"); stopScanner(); }
}

function stopScanner() {
    const video = document.getElementById('video');
    if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
    document.getElementById('scanner-overlay').style.display = 'none';
    scannerActive = false;
}

async function scanFrame() {
    if (!scannerActive) return;
    const video = document.getElementById('video');
    
    // Web Barcode Detector (Offline Native API)
    if ('BarcodeDetector' in window) {
        const detector = new BarcodeDetector();
        try {
            const barcodes = await detector.detect(video);
            if (barcodes.length > 0) {
                processCode(barcodes[0].rawValue);
                return;
            }
        } catch (e) {}
    }
    requestAnimationFrame(scanFrame);
}

function processCode(code) {
    stopScanner();
    // Offline database check
    const match = myInventory.find(it => it.barcode === code);
    if (match) {
        document.getElementById('itemName').value = match.name;
        currentExp = match.price.toString();
        document.getElementById('exp-view').innerText = currentExp;
        addItem(); // Auto add
        alert("Scanned: " + match.name);
    } else {
        if(confirm("New Barcode: " + code + "\nRegister this item?")) {
            let n = prompt("Item Name?");
            let p = prompt("Price?");
            myInventory.push({ name: n, price: p, barcode: code });
            localStorage.setItem('myInventory', JSON.stringify(myInventory));
            loadInventory();
        }
    }
}
    // Thermal Printer Logic for SHREYANS SRS588
async function printThermal() {
    if (items.length === 0) return alert("Pehle item add karein!");

    try {
        if (!printerDevice) {
            printerDevice = await navigator.bluetooth.requestDevice({
                filters: [{ services: ['000018f0-0000-1000-8000-00805f9b34fb'] }, { namePrefix: 'SRS' }, { namePrefix: 'Bluetooth' }],
                optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb']
            });
        }

        const server = await printerDevice.gatt.connect();
        const service = await server.getPrimaryService('000018f0-0000-1000-8000-00805f9b34fb');
        const characteristic = await service.getCharacteristic('00002af1-0000-1000-8000-00805f9b34fb');

        let name = document.getElementById('custName').value || "Customer";
        let date = new Date().toLocaleString();
        
        // ESC/POS Commands
        let esc = '\x1B\x40'; // Initialize
        esc += '\x1B\x61\x01' + 'DIGITAL KHATA PRO\n'; // Center Align
        esc += '--------------------------------\n';
        esc += '\x1B\x61\x00' + `Cust: ${name}\n`;
        esc += `Date: ${date}\n`;
        esc += '--------------------------------\n';
        esc += 'Item            Qty       Price \n';
        esc += '--------------------------------\n';
        
        items.forEach(it => {
            let itemName = it.name.substring(0, 14).padEnd(15);
            let itemPrice = "Rs." + it.price.toFixed(2).padStart(10);
            esc += itemName + itemPrice + '\n';
        });

        esc += '--------------------------------\n';
        esc += `GRAND TOTAL: ${document.getElementById('final-baki').innerText}\n`;
        esc += '\x1B\x61\x01' + '\nTHANK YOU! VISIT AGAIN\n\n\n\n';

        const encoder = new TextEncoder();
        await characteristic.writeValue(encoder.encode(esc));
        alert("Printing...");
    } catch (error) {
        console.log(error);
        alert("Printer connect nahi hua. Bluetooth on karein.");
    }
}
