<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Digital Khata - Fast Entry</title>
    <script src="https://cdn.jsdelivr.net/npm/@undecaf/barcode-detector-polyfill@latest/dist/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --p: #2563eb; --bg: #f8fafc; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg); overflow: hidden; position: fixed; width: 100vw; height: 100dvh; }
        
        #calc-page { max-width: 500px; margin: auto; background: #fff; height: 100dvh; display: flex; flex-direction: column; }
        .calc-header { background: var(--p); padding: 12px; display: flex; justify-content: space-between; align-items: center; color: white; }
        
        .app-body { flex: 1; overflow-y: auto; padding: 10px; }
        .items-list { border: 1px solid #eee; border-radius: 10px; min-height: 150px; margin-bottom: 10px; }
        .item-row { padding: 8px 12px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; font-weight: 600; font-size: 14px; }
        .item-row small { color: #64748b; font-weight: normal; font-size: 11px; }

        .final-total-box { background: #000; color: #ffca28; padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }

        .app-fixed-controls { background: #fff; padding: 12px; border-top: 2px solid #eee; }
        
        /* Compact Input Styling */
        .entry-grid { display: flex; gap: 5px; margin-bottom: 10px; }
        .entry-grid input { padding: 12px 8px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 14px; outline: none; transition: 0.2s; }
        .entry-grid input:focus { border-color: var(--p); background: #eff6ff; }
        
        .numpad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
        .n-btn { height: 50px; font-size: 18px; border-radius: 8px; border: none; background: #f1f5f9; font-weight: bold; }
        .star-btn { background: var(--p); color: white; grid-row: span 2; height: 105px; }
        .op-btn { background: #e2e8f0; }

        #scanner-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:black; z-index:999; flex-direction:column; align-items:center; justify-content:center; }
        video { width: 90%; border-radius: 10px; border: 2px solid var(--p); }
    </style>
</head>
<body>

<div id="scanner-overlay">
    <video id="video" autoplay playsinline></video>
    <button onclick="stopScanner()" style="margin-top:20px; padding:10px 40px; background:red; color:white; border:none; border-radius:50px;">Cancel</button>
</div>

<div id="calc-page" style="display: flex;">
    <div class="calc-header">
        <div onclick="location.reload()"><i class="fas fa-store"></i> <b>Digital Khata</b></div>
        <div><i class="fas fa-barcode" onclick="startScanner()" style="font-size:22px;"></i></div>
    </div>

    <div class="app-body" id="bill-area">
        <input type="text" id="custName" placeholder="Customer Name" style="width:100%; padding:10px; margin-bottom:10px; border:none; border-bottom:1px solid #ddd; outline:none; font-weight:bold;">
        <div class="items-list" id="items-list"></div>
        <div class="final-total-box">
            <span>GRAND TOTAL</span>
            <span id="final-total" style="font-size:22px;">₹ 0.00</span>
        </div>
    </div>

    <div class="app-fixed-controls">
        <div class="entry-grid">
            <input type="text" id="itemName" placeholder="Item Name" style="flex:2;">
            <input type="number" id="itemQty" placeholder="Qty" style="width:60px; text-align:center;">
            <input type="number" id="itemRate" placeholder="Rate" style="width:90px; text-align:center;">
        </div>

        <div class="numpad">
            <button class="n-btn op-btn" onclick="clearInputs()">AC</button>
            <button class="n-btn op-btn" onclick="back()"><i class="fas fa-backspace"></i></button>
            <button class="n-btn op-btn" onclick="saveBill()"><i class="fas fa-camera"></i></button>
            <button class="n-btn op-btn" onclick="printThermal()"><i class="fas fa-print"></i></button>
            
            <button class="n-btn" onclick="press('7')">7</button>
            <button class="n-btn" onclick="press('8')">8</button>
            <button class="n-btn" onclick="press('9')">9</button>
            <button class="n-btn star-btn" onclick="handleStar()">*<br><small style="font-size:10px;">ENTER</small></button>
            
            <button class="n-btn" onclick="press('4')">4</button>
            <button class="n-btn" onclick="press('5')">5</button>
            <button class="n-btn" onclick="press('6')">6</button>

            <button class="n-btn" onclick="press('1')">1</button>
            <button class="n-btn" onclick="press('2')">2</button>
            <button class="n-btn" onclick="press('3')">3</button>
            <button class="n-btn op-btn" onclick="press('.')">.</button>

            <button class="n-btn" onclick="press('0')" style="grid-column: span 2;">0</button>
            <button class="n-btn op-btn" onclick="location.reload()"><i class="fas fa-sync"></i></button>
        </div>
    </div>
</div>

<script>
let items = [], myInventory = JSON.parse(localStorage.getItem('myInventory')) || [];
let currentFocus = "itemQty"; // Default focus starts here

// Focus management
document.getElementById('itemQty').onfocus = () => currentFocus = "itemQty";
document.getElementById('itemRate').onfocus = () => currentFocus = "itemRate";
document.getElementById('itemName').onfocus = () => currentFocus = "itemName";

function press(v) {
    let input = document.getElementById(currentFocus);
    input.value += v;
    input.focus();
}

function back() {
    let input = document.getElementById(currentFocus);
    input.value = input.value.slice(0, -1);
}

function clearInputs() {
    document.getElementById('itemName').value = "";
    document.getElementById('itemQty').value = "";
    document.getElementById('itemRate').value = "";
    document.getElementById('itemName').focus();
}

// The Magic "*" Handler
function handleStar() {
    const nameBox = document.getElementById('itemName');
    const qtyBox = document.getElementById('itemQty');
    const rateBox = document.getElementById('itemRate');

    if (currentFocus === "itemQty") {
        if(qtyBox.value === "") qtyBox.value = "1";
        rateBox.focus();
    } 
    else if (currentFocus === "itemRate") {
        if (rateBox.value !== "") {
            addItemToList();
        }
    }
    else if (currentFocus === "itemName") {
        qtyBox.focus();
    }
}

function addItemToList() {
    let name = document.getElementById('itemName').value || "Item " + (items.length + 1);
    let qty = parseFloat(document.getElementById('itemQty').value) || 1;
    let rate = parseFloat(document.getElementById('itemRate').value) || 0;

    if (rate > 0) {
        items.push({ name, qty, rate, total: qty * rate });
        updateDisplay();
        clearInputs();
    }
}

function updateDisplay() {
    const list = document.getElementById('items-list');
    list.innerHTML = items.map(it => `
        <div class="item-row">
            <div>${it.name}<br><small>${it.qty} x ${it.rate}</small></div>
            <div>₹${it.total.toFixed(2)}</div>
        </div>`).join('');
    
    let grand = items.reduce((a, b) => a + b.total, 0);
    document.getElementById('final-total').innerText = "₹ " + grand.toFixed(2);
}

// --- Barcode Scanner Logic ---
async function startScanner() {
    document.getElementById('scanner-overlay').style.display = 'flex';
    const video = document.getElementById('video');
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = stream;
        const detector = new BarcodeDetector();
        const scan = async () => {
            const codes = await detector.detect(video);
            if (codes.length > 0) {
                let code = codes[0].rawValue;
                stopScanner();
                let match = myInventory.find(it => it.barcode === code);
                if (match) {
                    document.getElementById('itemName').value = match.name;
                    document.getElementById('itemRate').value = match.price;
                    document.getElementById('itemQty').focus();
                } else {
                    let n = prompt("New Item Name?");
                    let p = prompt("Rate?");
                    if(n && p) {
                        myInventory.push({ name: n, price: p, barcode: code });
                        localStorage.setItem('myInventory', JSON.stringify(myInventory));
                        document.getElementById('itemName').value = n;
                        document.getElementById('itemRate').value = p;
                        document.getElementById('itemQty').focus();
                    }
                }
                return;
            }
            requestAnimationFrame(scan);
        };
        scan();
    } catch (e) { stopScanner(); }
}

function stopScanner() {
    const video = document.getElementById('video');
    if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
    document.getElementById('scanner-overlay').style.display = 'none';
}

function saveBill() { /* Previous logic */ }
function printThermal() { /* Previous logic */ }
</script>
</body>
</html>
