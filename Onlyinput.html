<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Digital Khata - Pro POS</title>
    <script src="https://cdn.jsdelivr.net/npm/@undecaf/barcode-detector-polyfill@latest/dist/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --p: #2563eb; --bg: #f8fafc; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg); overflow: hidden; position: fixed; width: 100vw; height: 100dvh; }
        
        #calc-page { max-width: 500px; margin: auto; background: #fff; height: 100dvh; display: flex; flex-direction: column; }
        .calc-header { background: var(--p); padding: 12px; display: flex; justify-content: space-between; align-items: center; color: white; }
        
        .app-body { flex: 1; overflow-y: auto; padding: 10px; }
        .items-list { border: 1px solid #eee; border-radius: 10px; min-height: 150px; margin-bottom: 10px; background: #fff; }
        .item-row { padding: 10px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s; }
        .item-row:active { background: #e0e7ff; }
        .item-row b { font-size: 14px; color: #1e293b; }
        .item-row small { color: #64748b; font-size: 11px; }

        .final-total-box { background: #1e293b; color: #ffca28; padding: 12px 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }

        .app-fixed-controls { background: #fff; padding: 10px; border-top: 1px solid #e2e8f0; }
        .entry-grid { display: flex; gap: 5px; margin-bottom: 10px; }
        .entry-grid input { padding: 12px 8px; border: 2px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; font-weight: bold; }
        .entry-grid input:focus { border-color: var(--p); background: #f0f9ff; }
        
        .numpad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
        .n-btn { height: 45px; font-size: 18px; border-radius: 8px; border: none; background: #f1f5f9; font-weight: bold; color: #334155; }
        .n-btn:active { background: #cbd5e1; }
        .star-btn { background: var(--p) !important; color: white !important; grid-row: span 2; height: 94px; }
        .op-btn { background: #e2e8f0; }

        #scanner-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:black; z-index:999; flex-direction:column; align-items:center; justify-content:center; }
        video { width: 90%; border-radius: 10px; border: 2px solid var(--p); }
    </style>
</head>
<body>

<div id="scanner-overlay">
    <video id="video" autoplay playsinline></video>
    <button onclick="stopScanner()" style="margin-top:20px; padding:10px 40px; background:red; color:white; border:none; border-radius:50px;">Cancel</button>
</div>

<div id="calc-page">
    <div class="calc-header">
    <div onclick="location.reload()"><i class="fas fa-store"></i> <b>Billing</b></div>
    <div id="liveClock" style="font-size: 11px; text-align: right; line-height: 1.2;"></div>
    <div><i class="fas fa-barcode" onclick="startScanner()" style="font-size:22px;"></i></div>
  
    </div>

    <div class="app-body" id="bill-area">
        <input type="text" id="custName" placeholder="Customer Name (Touch for keyboard)" style="width:100%; padding:8px; margin-bottom:10px; border:none; border-bottom:1px solid #ddd; outline:none; font-weight:bold;">
        <div class="items-list" id="items-list"></div>
        <div class="final-total-box">
            <span>TOTAL AMOUNT</span>
            <b id="final-total" style="font-size:20px;">₹ 0.00</b>
       </div>
        <div class="history-section" style="padding: 15px; background: #fff; margin-top: 10px; border-top: 5px solid #f1f5f9;">
    <h3 style="font-size: 16px; margin-bottom: 10px; color: var(--p);">
        <i class="fas fa-history"></i> Recent Bills (CSV Saved)
    </h3>
    <div id="billGallery" style="display: grid; grid-template-columns: 1fr; gap: 8px;">
        </div>
</div>

<footer style="text-align: center; padding: 20px; color: #94a3b8; font-size: 12px; background: #fff;">
    <p><b>Digital Khata Pro</b> v2.0</p>
    <p>Developed for Fast Wholesale & Retail Billing</p>
</footer>
    </div>
    <div class="app-fixed-controls">
        <div class="entry-grid">
            <input type="text" id="itemName" placeholder="Item Name" style="flex:2;">
            <input type="text" id="itemQty" placeholder="Qty" readonly inputmode="none" style="width:65px; text-align:center;">
            <input type="text" id="itemRate" placeholder="Rate" readonly inputmode="none" style="width:95px; text-align:center;">
        </div>

        <div class="numpad">
            <button class="n-btn op-btn" onclick="clearAll()">AC</button>
            <button class="n-btn op-btn" onclick="back()"><i class="fas fa-backspace"></i></button>
            <button class="n-btn op-btn" onclick="saveBill()"><i class="fas fa-camera"></i></button>
            <button class="n-btn op-btn" onclick="printThermal()"><i class="fas fa-print"></i></button>
            
            <button class="n-btn" onclick="press('7')">7</button>
            <button class="n-btn" onclick="press('8')">8</button>
            <button class="n-btn" onclick="press('9')">9</button>
            <button class="n-btn star-btn" onclick="handleStar()">*<br><small style="font-size:10px;">NEXT</small></button>
            
            <button class="n-btn" onclick="press('4')">4</button>
            <button class="n-btn" onclick="press('5')">5</button>
            <button class="n-btn" onclick="press('6')">6</button>

            <button class="n-btn" onclick="press('1')">1</button>
            <button class="n-btn" onclick="press('2')">2</button>
            <button class="n-btn" onclick="press('3')">3</button>
            <button class="n-btn op-btn" onclick="press('.')">.</button>

            <button class="n-btn" onclick="press('0')" style="grid-column: span 2;">0</button>
            <button class="n-btn op-btn" onclick="location.reload()"><i class="fas fa-sync"></i></button>
        </div>
    </div>
</div>

<script>
    let editIndex = null; // Track karne ke liye ki kaunsa item edit ho raha hai
let items = [], myInventory = JSON.parse(localStorage.getItem('myInventory')) || [];
let currentFocus = "itemQty"; // Default focus is Qty

// Initially focus Qty
document.getElementById('itemQty').focus();

// Focus management - Block keyboard but keep our internal focus
document.querySelectorAll('.entry-grid input').forEach(inp => {
    inp.addEventListener('click', (e) => {
        currentFocus = e.target.id;
        // If it's Item Name, let mobile keyboard open naturally
    });
});

function press(v) {
    let input = document.getElementById(currentFocus);
    if(currentFocus === "itemName") return; // Keypad doesn't type in Name
    input.value += v;
}

function back() {
    let input = document.getElementById(currentFocus);
    input.value = input.value.slice(0, -1);
}

function clearAll() {
    if(confirm("New Bill?")) {
        items = [];
        updateDisplay();
        resetInputs();
    }
}

function resetInputs() {
    document.getElementById('itemName').value = "";
    document.getElementById('itemQty').value = "";
    document.getElementById('itemRate').value = "";
    document.getElementById('itemQty').focus();
    currentFocus = "itemQty";
}

// Logic for '*' Key
function handleStar() {
    const qty = document.getElementById('itemQty');
    const rate = document.getElementById('itemRate');
    const name = document.getElementById('itemName');

    if (currentFocus === "itemQty") {
        if(qty.value === "") qty.value = "1";
        currentFocus = "itemRate";
        rate.focus();
    } 
    else if (currentFocus === "itemRate") {
        if (rate.value !== "") {
            addItemToList();
        }
    }
    else if (currentFocus === "itemName") {
        currentFocus = "itemQty";
        qty.focus();
    }
}

function addItemToList() {
    const n = document.getElementById('itemName').value || "General Item";
    const q = parseFloat(document.getElementById('itemQty').value) || 1;
    const r = parseFloat(document.getElementById('itemRate').value) || 0;

    if (r > 0) {
        let newItem = { name: n, qty: q, rate: r, total: q * r };
        
        if (editIndex !== null) {
            // Agar edit mode tha, toh usi position par update karo
            items[editIndex] = newItem;
            editIndex = null; // Reset edit mode
        } else {
            // Naya item hai toh niche jodo
            items.push(newItem);
        }
        
        updateDisplay();
        resetInputs();
    }
}

function updateDisplay() {
    const list = document.getElementById('items-list');
    list.innerHTML = items.map((it, index) => `
        <div class="item-row" onclick="editItem(${index})">
            <div><b>${it.name}</b><br><small>${it.qty} x ${it.rate}</small></div>
            <div>₹${it.total.toFixed(2)}</div>
        </div>`).join('');
    
    let grand = items.reduce((a, b) => a + b.total, 0);
    document.getElementById('final-total').innerText = "₹ " + grand.toFixed(2);
}

// Edit Mode Function
function editItem(index) {
    const it = items[index];
    document.getElementById('itemName').value = it.name;
    document.getElementById('itemQty').value = it.qty;
    document.getElementById('itemRate').value = it.rate;
    
    editIndex = index; // Index ko save kar liya
    
    currentFocus = "itemQty";
    document.getElementById('itemQty').focus();
    // Is baar hum splice nahi karenge, sirf UI mein highlight kar sakte hain
}


// Scanner Logic
async function startScanner() {
    document.getElementById('scanner-overlay').style.display = 'flex';
    const video = document.getElementById('video');
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = stream;
        const detector = new BarcodeDetector();
        const scan = async () => {
            const codes = await detector.detect(video);
            if (codes.length > 0) {
                let code = codes[0].rawValue;
                stopScanner();
                let match = myInventory.find(it => it.barcode === code);
                if (match) {
                    document.getElementById('itemName').value = match.name;
                    document.getElementById('itemRate').value = match.price;
                    document.getElementById('itemQty').focus();
                    currentFocus = "itemQty";
                }
                return;
            }
            if(document.getElementById('scanner-overlay').style.display === 'flex') requestAnimationFrame(scan);
        };
        scan();
    } catch (e) { stopScanner(); }
}

function stopScanner() {
    const video = document.getElementById('video');
    if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
    document.getElementById('scanner-overlay').style.display = 'none';
}

function saveBill() { alert("Bill Saved!"); /* Previous screenshot code */ }
function printThermal() { alert("Printing..."); /* Previous Bluetooth code */ }
function startClock() {
    setInterval(() => {
        const now = new Date();
        const dateStr = now.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' });
        const timeStr = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        document.getElementById('liveClock').innerHTML = `${dateStr}<br>${timeStr}`;
    }, 1000);
}
let savedBillsHistory = JSON.parse(localStorage.getItem('savedBillsHistory')) || [];

function saveBill() {
    if (items.length === 0) return alert("Bill khali hai!");

    const custName = document.getElementById('custName').value || "Cash_Customer";
    const date = new Date().toLocaleDateString().replace(/\//g, '-');
    const fileName = `Bill_${custName}_${date}.csv`;

    // 1. CSV Data Taiyar karna
    let csvContent = "Item Name,Quantity,Rate,Total\n"; // Header
    items.forEach(it => {
        csvContent += `${it.name},${it.qty},${it.rate},${it.total}\n`;
    });
    
    let grandTotal = items.reduce((a, b) => a + b.total, 0);
    csvContent += `\n,,,GRAND TOTAL,${grandTotal}`;

    // 2. CSV File Download karna
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    const url = URL.createObjectURL(blob);
    link.setAttribute("href", url);
    link.setAttribute("download", fileName);
    link.style.visibility = 'hidden';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    // 3. History mein save karna (sirf record ke liye)
    const billRecord = {
        name: custName,
        total: grandTotal,
        date: new Date().toLocaleString(),
        itemCount: items.length
    };
    savedBillsHistory.unshift(billRecord); // Naya bill upar dikhega
    if(savedBillsHistory.length > 10) savedBillsHistory.pop(); // Sirf last 10 bills rakhein
    localStorage.setItem('savedBillsHistory', JSON.stringify(savedBillsHistory));
    
    updateGallery();
    alert("CSV File Saved & Downloaded!");
}

function updateGallery() {
    const gallery = document.getElementById('billGallery');
    gallery.innerHTML = savedBillsHistory.map(bill => `
        <div style="padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; background: #f8fafc;">
            <div>
                <b style="font-size: 13px;">${bill.name}</b><br>
                <small style="color: #64748b;">${bill.date} | ${bill.itemCount} Items</small>
            </div>
            <b style="color: #059669;">₹${bill.total.toFixed(2)}</b>
        </div>
    `).join('');
}

// Window load par gallery refresh karein
window.onload = () => {
    updateGallery();
    startClock();
};

// Ise window load ya goToCalc ke andar call karein
/* startClock();*/

</script>
</body>
</html>
