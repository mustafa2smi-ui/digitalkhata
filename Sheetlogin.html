<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khan Shop Pro</title>
  <style>
    :root { --p: #27ae60; --s: #2ecc71; --d: #2c3e50; --err: #e74c3c; }
    body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f4f7f6; padding-bottom: 220px; }
    
    /* Header & Shop Details */
    .header { background: var(--p); color: white; padding: 15px; text-align: center; border-radius: 0 0 20px 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .shop-name { font-size: 22px; font-weight: bold; display: block; }
    .shop-contact { font-size: 12px; opacity: 0.9; }

    /* Inputs */
    .cust-info { padding: 10px; display: flex; gap: 10px; }
    input { width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 10px; outline: none; }
    input:focus { border-color: var(--p); }

    /* Grid & Cards */
    .cat-bar { display: flex; overflow-x: auto; gap: 10px; padding: 10px; scrollbar-width: none; }
    .cat-btn { background: white; padding: 8px 15px; border-radius: 20px; border: 1px solid var(--p); white-space: nowrap; color: var(--p); font-weight: bold; font-size: 13px; }
    .cat-active { background: var(--p); color: white; }
    
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
    .p-card { background: white; padding: 12px; border-radius: 12px; border-bottom: 4px solid var(--p); box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: center; }

    /* Footer Bill */
    .footer-bill { position: fixed; bottom: 0; left: 0; width: 100%; background: white; box-shadow: 0 -5px 20px rgba(0,0,0,0.15); border-radius: 25px 25px 0 0; }
    .bill-items { max-height: 120px; overflow-y: auto; padding: 10px; }
    .item-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #f1f1f1; }
    
    /* Action Buttons Area */
    .action-bar { display: flex; justify-content: space-around; padding: 10px; background: #fff; border-top: 1px solid #eee; }
    .round-btn { width: 45px; height: 45px; border-radius: 50%; border: none; color: white; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
    
    .btn-print { background: #3498db; }
    .btn-csv { background: #f39c12; }
    .btn-share { background: #25D366; }
    .btn-clear { background: var(--err); }
    
    .total-strip { background: var(--d); color: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
    .qty-btn { width: 25px; height: 25px; border-radius: 50%; border: none; background: #eee; font-weight: bold; }
  </style>
</head>
<body>

<div id="loginPage" style="display:none; text-align:center; padding-top:100px;">
    <h2>Khan Shop</h2>
    <input type="email" id="emailInput" style="width:80%" placeholder="Enter Email">
    <button class="btn" onclick="handleLogin()" style="width:80%; background:var(--p); color:white; padding:12px; border:none; border-radius:10px; margin-top:10px;">Login</button>
</div>

<div id="billingPage" style="display:none;">
    <div class="header">
        <span class="shop-name">KHAN SHOP</span>
        <span class="shop-contact">Contact: +91 9876543210</span>
    </div>

    <div class="cust-info">
        <input type="text" id="custName" placeholder="Customer Name">
    </div>

    <div style="display:flex; justify-content:center; gap:10px; margin-bottom:10px;">
        <button id="rtBtn" class="cat-btn cat-active" onclick="setMode('retail')">Retail</button>
        <button id="wsBtn" class="cat-btn" onclick="setMode('ws')">Wholesale</button>
    </div>

    <div id="catBar" class="cat-bar"></div>
    <div id="prodGrid" class="grid"></div>

    <div class="footer-bill">
        <div id="billItems" class="bill-items"></div>
        
        <div class="action-bar">
            <button class="round-btn btn-print" title="Print" onclick="window.print()">🖨️</button>
            <button class="round-btn btn-csv" title="CSV" onclick="downloadCSV()">📊</button>
            <button class="round-btn btn-share" title="Share" onclick="shareBill()">🔗</button>
            <button class="round-btn btn-clear" title="Clear Bill" onclick="clearBill()">❌</button>
        </div>

        <div class="total-strip">
            <span id="grandTotal">Total: ₹0</span>
            <small id="itemCount">0 Items</small>
        </div>
    </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxLZtlffobzjx8x3yVKSirR_-vqIajS8AulhZ_9toWs33SEvGf8FCKHwpiEDi1n_nEvHQ/exec";
  let inventory = [], cart = {}, mode = 'retail', selectedCat = 'All';

  // Fast Login Check
  window.onload = function() {
    const savedEmail = localStorage.getItem('khan_shop_email');
    if(savedEmail) {
        document.getElementById('emailInput').value = savedEmail;
        handleLogin(); // Auto Login
    } else {
        document.getElementById('loginPage').style.display = 'block';
    }
  };

  async function handleLogin() {
    const email = document.getElementById('emailInput').value;
    if(!email) return;
    try {
      const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ email: email }) });
      const data = await response.json();
      if(data.status === "Allow") {
        localStorage.setItem('khan_shop_email', email); // Save for next time
        inventory = data.inventory;
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('billingPage').style.display = 'block';
        renderCats(); renderGrid();
      } else { alert("Status: " + data.status); }
    } catch(e) { alert("Connection Error!"); }
  }

  function renderCats() {
    const cats = ['All', ...new Set(inventory.map(i => i.cat))];
    document.getElementById('catBar').innerHTML = cats.map(c => `
      <div class="cat-btn ${selectedCat === c ? 'cat-active' : ''}" onclick="filterCat('${c}')">${c}</div>
    `).join('');
  }

  function filterCat(c) { selectedCat = c; renderCats(); renderGrid(); }

  function renderGrid() {
    const grid = document.getElementById('prodGrid');
    const filtered = selectedCat === 'All' ? inventory : inventory.filter(i => i.cat === selectedCat);
    grid.innerHTML = filtered.map(i => `
      <div class="p-card" onclick="addToCart('${i.code}')">
        <strong>${i.name}</strong><br>
        <span style="color:var(--p); font-weight:bold;">₹${mode === 'retail' ? i.retail : i.ws}</span>
      </div>
    `).join('');
  }

  function setMode(m) {
    mode = m;
    document.getElementById('rtBtn').classList.toggle('cat-active', m==='retail');
    document.getElementById('wsBtn').classList.toggle('cat-active', m==='ws');
    renderGrid(); updateBill();
  }

  function addToCart(code) {
    if(cart[code]) cart[code].qty++;
    else {
      const p = inventory.find(i => i.code == code);
      cart[code] = { ...p, qty: 1 };
    }
    updateBill();
  }

  function updateQty(code, d) {
    if(cart[code]) {
      cart[code].qty += d;
      if(cart[code].qty <= 0) delete cart[code];
      updateBill();
    }
  }

  function clearBill() {
    if(confirm("Pura bill saaf karein?")) {
        cart = {};
        document.getElementById('custName').value = "";
        updateBill();
    }
  }

  function updateBill() {
    const container = document.getElementById('billItems');
    let total = 0, count = 0;
    container.innerHTML = "";
    for(let key in cart) {
      let item = cart[key];
      let rate = mode === 'retail' ? item.retail : item.ws;
      let sub = item.qty * rate;
      total += sub; count++;
      container.innerHTML += `
        <div class="item-row">
          <div style="flex:1"><b>${item.name}</b> <small>(₹${rate})</small></div>
          <div class="qty-ctrl">
            <button class="qty-btn" onclick="updateQty('${key}', -1)">-</button>
            <span style="margin:0 10px">${item.qty}</span>
            <button class="qty-btn" onclick="updateQty('${key}', 1)">+</button>
          </div>
          <div style="width:60px; text-align:right;">₹${sub}</div>
        </div>`;
    }
    document.getElementById('grandTotal').innerText = "Total: ₹" + total;
    document.getElementById('itemCount').innerText = count + " Items";
  }

  function downloadCSV() {
    let csv = "Item,Qty,Rate,Amount\n";
    for(let k in cart) {
        let r = mode === 'retail' ? cart[k].retail : cart[k].ws;
        csv += `${cart[k].name},${cart[k].qty},${r},${cart[k].qty*r}\n`;
    }
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'Bill.csv'; a.click();
  }

  function shareBill() {
    const name = document.getElementById('custName').value || "Customer";
    let text = `*Khan Shop Bill*\nDate: ${new Date().toLocaleDateString()}\nCust: ${name}\n----------\n`;
    for(let k in cart) {
        let r = mode === 'retail' ? cart[k].retail : cart[k].ws;
        text += `${cart[k].name} x ${cart[k].qty} = ₹${cart[k].qty*r}\n`;
    }
    text += `----------\n*Total: ${document.getElementById('grandTotal').innerText}*`;
    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`);
  }
</script>
</body>
</html>
