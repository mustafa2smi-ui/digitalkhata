<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khan Shop Billing</title>
  <style>
    :root { --primary: #27ae60; --secondary: #2ecc71; --dark: #2c3e50; }
    body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f0f2f5; }
    
    /* Login Style */
    #loginPage { height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 350px; text-align: center; border: 3px solid var(--primary); }
    input { width: 100%; padding: 12px; margin: 15px 0; border: 2px solid #ddd; border-radius: 10px; box-sizing: border-box; }
    .btn { background: var(--primary); color: white; padding: 12px 25px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; }
    .btn:hover { background: var(--secondary); transform: scale(1.02); }

    /* Billing Style */
    #billingPage { display: none; padding: 10px; padding-bottom: 200px; }
    .header { background: var(--primary); color: white; padding: 15px; border-radius: 10px; text-align: center; margin-bottom: 10px; }
    
    .cat-bar { display: flex; overflow-x: auto; gap: 10px; padding-bottom: 10px; }
    .cat-btn { background: white; padding: 8px 15px; border-radius: 20px; border: 1px solid var(--primary); white-space: nowrap; font-size: 13px; font-weight: bold; color: var(--primary); }
    .cat-active { background: var(--primary); color: white; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .p-card { background: white; padding: 12px; border-radius: 12px; border-left: 5px solid var(--primary); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .p-card:active { background: #e8f5e9; }

    .footer-bill { position: fixed; bottom: 0; left: 0; width: 100%; background: white; box-shadow: 0 -5px 15px rgba(0,0,0,0.1); border-radius: 20px 20px 0 0; z-index: 100; }
    .bill-items { max-height: 140px; overflow-y: auto; padding: 10px; }
    .item-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; }
    .qty-ctrl { display: flex; align-items: center; gap: 8px; }
    .q-btn { width: 28px; height: 28px; border-radius: 50%; border: none; background: #eee; font-weight: bold; }
    .total-bar { padding: 15px; background: var(--dark); color: white; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>

<div id="loginPage">
  <div class="card">
    <h2 style="color:var(--primary)">Khan Shop</h2>
    <p>Staff Login</p>
    <input type="email" id="emailInput" placeholder="Apna Email Likhein">
    <button class="btn" onclick="handleLogin()">LOGIN</button>
    <div id="loginMsg" style="margin-top:10px; font-size:12px;"></div>
  </div>
</div>

<div id="billingPage">
  <div class="header">
    <strong>KHAN SHOP - BILLING</strong>
    <div style="margin-top:10px;">
      <button id="rtBtn" class="cat-btn cat-active" onclick="setMode('retail')">Retail</button>
      <button id="wsBtn" class="cat-btn" onclick="setMode('ws')">Wholesale</button>
    </div>
  </div>

  <div id="catBar" class="cat-bar"></div>
  <div id="prodGrid" class="grid"></div>

  <div class="footer-bill">
    <div id="billItems" class="bill-items"></div>
    <div class="total-bar">
      <h3 id="grandTotal" style="margin:0;">Total: ₹0</h3>
      <button onclick="location.reload()" style="background:red; color:white; border:none; padding:8px 15px; border-radius:5px;">Clear</button>
    </div>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxLZtlffobzjx8x3yVKSirR_-vqIajS8AulhZ_9toWs33SEvGf8FCKHwpiEDi1n_nEvHQ/exec";
  let inventory = [], cart = {}, mode = 'retail', selectedCat = 'All';

  async function handleLogin() {
    const email = document.getElementById('emailInput').value;
    if(!email) return alert("Email zaruri hai");
    
    document.getElementById('loginMsg').innerText = "Verifying...";
    
    try {
      const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ email: email }) });
      const data = await response.json();
      
      if(data.status === "Allow") {
        inventory = data.inventory;
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('billingPage').style.display = 'block';
        renderCats();
        renderGrid();
      } else {
        document.getElementById('loginMsg').innerHTML = `<span style="color:red">Status: ${data.status}. Admin se sampark karein.</span>`;
      }
    } catch(e) { alert("Connection Error!"); }
  }

  function renderCats() {
    const cats = ['All', ...new Set(inventory.map(i => i.cat))];
    document.getElementById('catBar').innerHTML = cats.map(c => `
      <div class="cat-btn ${selectedCat === c ? 'cat-active' : ''}" onclick="filterCat('${c}')">${c}</div>
    `).join('');
  }

  function filterCat(c) { selectedCat = c; renderCats(); renderGrid(); }

  function renderGrid() {
    const grid = document.getElementById('prodGrid');
    const filtered = selectedCat === 'All' ? inventory : inventory.filter(i => i.cat === selectedCat);
    grid.innerHTML = filtered.map(i => `
      <div class="p-card" onclick="addToCart('${i.code}')">
        <strong>${i.name}</strong><br>
        <span style="color:var(--primary); font-weight:bold;">₹${mode === 'retail' ? i.retail : i.ws}</span>
        <div style="font-size:10px; color:gray;">${i.unit}</div>
      </div>
    `).join('');
  }

  function setMode(m) {
    mode = m;
    document.getElementById('rtBtn').classList.toggle('cat-active', m==='retail');
    document.getElementById('wsBtn').classList.toggle('cat-active', m==='ws');
    renderGrid(); updateBill();
  }

  function addToCart(code) {
    if(cart[code]) cart[code].qty++;
    else {
      const p = inventory.find(i => i.code == code);
      cart[code] = { ...p, qty: 1 };
    }
    updateBill();
  }

  function updateQty(code, d) {
    if(cart[code]) {
      cart[code].qty += d;
      if(cart[code].qty <= 0) delete cart[code];
      updateBill();
    }
  }

  function updateBill() {
    const container = document.getElementById('billItems');
    let total = 0;
    container.innerHTML = "";
    for(let key in cart) {
      let item = cart[key];
      let rate = mode === 'retail' ? item.retail : item.ws;
      let sub = item.qty * rate;
      total += sub;
      container.innerHTML += `
        <div class="item-row">
          <div style="flex:1"><b>${item.name}</b><br><small>₹${rate}</small></div>
          <div class="qty-ctrl">
            <button class="q-btn" onclick="updateQty('${key}', -1)">-</button>
            <span>${item.qty}</span>
            <button class="q-btn" onclick="updateQty('${key}', 1)">+</button>
          </div>
          <div style="width:70px; text-align:right;">₹${sub}</div>
        </div>`;
    }
    document.getElementById('grandTotal').innerText = "Total: ₹" + total;
  }
</script>
</body>
</html>
