<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Tasbeeh Counter - Islamic Virasat Tools</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕌</text></svg>">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Amiri&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #27ae60; --dark: #2c3e50; --bg: #f9fbf9; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: var(--dark); text-align: center; overflow: hidden; }

        /* Universal Header */
        header { background: #fff; padding: 15px; display: flex; justify-content: space-between; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 1000; }
        .logo { font-weight: 600; color: var(--primary); }

        /* Counter Container */
        .counter-section { 
            height: 80vh; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; padding: 20px; 
        }

        /* Number Display with Glow */
        #countDisplay { 
            font-size: 5rem; font-weight: 600; color: var(--primary); 
            text-shadow: 0 0 20px rgba(39, 174, 96, 0.4); 
            margin-bottom: 30px; 
        }

        /* Target Selector Dropdown */
        .target-select {
            padding: 8px 15px; border-radius: 20px; border: 1px solid #eee;
            background: #fff; color: #777; font-size: 0.8rem; outline: none;
            cursor: pointer; margin-bottom: 20px;
        }

        /* Main Circular Click Button */
        .click-btn { 
            width: 150px; height: 150px; border-radius: 50%; 
            background: linear-gradient(145deg, #2ecc71, #27ae60); 
            color: white; border: 10px solid #fff; font-size: 2.5rem; 
            cursor: pointer; transition: 0.2s;
            box-shadow: 20px 20px 60px #e1e8e1, -20px -20px 60px #ffffff;
            outline: none; -webkit-tap-highlight-color: transparent; /* Mobile fix */
        }
        .click-btn:active { 
            transform: scale(0.95); 
            box-shadow: inset 10px 10px 30px rgba(0,0,0,0.1), inset -10px -10px 30px rgba(255,255,255,0.5); 
        }

        /* Control Buttons (Reset/Vibrate) */
        .controls { display: flex; gap: 15px; margin-top: 30px; }
        .icon-btn { 
            width: 50px; height: 50px; border-radius: 50%; 
            border: none; color: white; cursor: pointer; font-size: 1.2rem; 
            display: flex; align-items: center; justify-content: center;
        }
        .reset-bg { background: #e74c3c; } /* Red */
        .vibe-bg { background: #34495e; } /* Dark Blue */

        /* Bismillah with glow */
        .bismillah { font-family: 'Amiri', serif; font-size: 1.8rem; color: var(--primary); margin-bottom: 15px; }
    </style>
</head>
<body>

<header>
    <a href="index.html" style="text-decoration:none;" class="logo">Islamic Virasat</a>
    <div style="font-size:1.3rem;">☰</div>
</header>

<div class="counter-section">
    <div class="bismillah">﷽</div>
    
    <select class="target-select" id="targetSelect" onchange="setTarget()">
        <option value="33">Target: 33</option>
        <option value="100">Target: 100</option>
        <option value="1000">Target: Unlimited</option>
    </select>

    <div id="countDisplay">000</div>
    
    <button class="click-btn" onclick="incrementCount()" title="Click to Count">📿</button>
    
    <div class="controls">
        <button class="icon-btn vibe-bg" id="vibeBtn" onclick="toggleVibration()" title="Toggle Vibration">📳</button>
        <button class="icon-btn reset-bg" onclick="resetCount()" title="Reset Counter">🔄</button>
    </div>
</div>

<script>
    let count = 0;
    let target = 33;
    let vibrateOn = true;

    function incrementCount() {
        count++;
        updateDisplay();
        
        if (vibrateOn && navigator.vibrate) {
            navigator.vibrate(50); // Short vibration
        }

        if (count >= target) {
            handleTargetMet();
        }
    }

    function updateDisplay() {
        // Numbers ko 001 format mein laane ke liye padding
        const display = count.toString().padStart(3, '0');
        document.getElementById('countDisplay').innerText = display;
    }

    function setTarget() {
        target = parseInt(document.getElementById('targetSelect').value);
        resetCount(); // Reset when target changes
    }

    function resetCount() {
        count = 0;
        updateDisplay();
    }

    function toggleVibration() {
        vibrateOn = !vibrateOn;
        const btn = document.getElementById('vibeBtn');
        btn.innerHTML = vibrateOn ? '📳' : '🔇';
        btn.style.opacity = vibrateOn ? '1' : '0.5';
    }

    function handleTargetMet() {
        if (vibrateOn && navigator.vibrate) {
            navigator.vibrate([200, 100, 200]); // Long pattern
        }
        alert(`Alhamdulillah! Aapne ${target} counts poore kar liye.`);
        resetCount();
    }
</script>

</body>
</html>
