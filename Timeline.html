                const response = await fetch(file);
                const htmlText = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');

                const eventObj = {
                    date: doc.querySelector('.date')?.innerText.replace('📅 Date: ', '') || 'N/A',
                    title: doc.querySelector('h1')?.innerText || 'Title',
                    img: doc.querySelector('img')?.src || '',
                    desc: doc.querySelector('p')?.innerText || '',
                    file: file
                };
                
                // Slider ke liye data save karna
                allEventsData.push(eventObj);

                // Timeline Card banana
                const row = document.createElement('div');
                row.className = 'event-row';
                row.innerHTML = `
                    <div class="date-col">${eventObj.date}</div>
                    <div class="content-col" onclick="openLightbox(${i})">
                        <h3>${eventObj.title}</h3>
                        <img src="${eventObj.img}">
                        <p>${eventObj.desc.substring(0, 100)}...</p>
                        <small style="color:var(--line); cursor:pointer;">Tap to read more 📖</small>
                    </div>
                `;
                container.appendChild(row);
                
                // Scroll Animation (Fade in effect)
                setTimeout(() => row.classList.add('show'), 150 * i);
                
            } catch (e) { 
                console.log("Error loading " + file, e); 
            }
        }
    }

    function changeSlide(direction) {
        currentSlideIndex += direction;
        if (currentSlideIndex >= allEventsData.length) currentSlideIndex = 0;
        if (currentSlideIndex < 0) currentSlideIndex = allEventsData.length - 1;
        updateLightboxContent();
    }

    function closeLightbox() {
        document.getElementById('cardLightbox').style.display = 'none';
    }
// --- Swipe Logic Start ---
let touchstartX = 0;
let touchendX = 0;

const sliderZone = document.getElementById('cardLightbox');

sliderZone.addEventListener('touchstart', e => {
    touchstartX = e.changedTouches[0].screenX;
});

sliderZone.addEventListener('touchend', e => {
    touchendX = e.changedTouches[0].screenX;
    handleGesture();
});

function handleGesture() {
    if (touchendX < touchstartX - 50) {
        // Left Swipe hua -> Next Slide
        changeSlide(1);
    }
    if (touchendX > touchstartX + 50) {
        // Right Swipe hua -> Previous Slide
        changeSlide(-1);
    }
}
// --- Swipe Logic End ---
function playTTS(text) {
    window.speechSynthesis.cancel(); // Pehle wala speech stop karein
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'hi-IN'; // Hindi voice ke liye
    utterance.rate = 0.9;     // Thoda dheere bolne ke liye
    window.speechSynthesis.speak(utterance);
}
// Function: Screenshot lekar share karna (Watermark ke sath)
async function shareCardAsImage(title) {
    const card = document.getElementById('activeCardContent'); // Lightbox ka card
    const watermark = document.getElementById('watermarkBox'); // Watermark box
    
    // 1. Watermark ko card ke niche jodna temporarily
    watermark.style.display = 'block'; // Show temporarily
    card.appendChild(watermark); 

    try {
        // 2. Card ki photo khinchna (Lightbox effect hatane ke liye useCors true)
        const canvas = await html2canvas(card, {
            useCORS: true, // GitHub images fetch karne ke liye
            backgroundColor: "#ffffff", // Background white rakhein
            scale: 2 // Quality achi karne ke liye
        });

        // 3. Canvas ko Image (Blob) mein badalna
        canvas.toBlob(async (blob) => {
            const file = new File([blob], `${title}.png`, { type: 'image/png' });

            // 4. Native Share Menu kholna
            if (navigator.share) {
                navigator.share({
                    files: [file],
                    title: title,
                    text: `📜 Check out this event: ${title}\nRead more at: ${window.location.origin}`
                }).then(() => console.log('Share successful'))
                  .catch((error) => console.log('Sharing failed', error));
            } else {
                alert("Sharing not supported on this browser.");
            }
        });
        
    } catch (e) {
        console.error("Screenshot error: ", e);
    } finally {
        // 5. Cleanup: Watermark ko hata kar wapas chhupana
        watermark.style.display = 'none';
        document.body.appendChild(watermark); // Wapas body mein bhej dein
    }
}

    // 4. Sharing Functions
    function shareMain() {
        if (navigator.share) {
            navigator.share({ 
                title: 'Timeline History Prophet', 
                url: window.location.href 
            });
        }
    }

    function shareCard(title, text, file) {
        const shareUrl = window.location.origin + '/' + file;
        if (navigator.share) {
            navigator.share({
                title: title,
                text: `📜 Check out this event: ${title}`,
                url: shareUrl
            });
        } else {
            alert("Sharing not supported, link copied: " + shareUrl);
            navigator.clipboard.writeText(shareUrl);
        }
    }

    window.onload = loadEvents;
