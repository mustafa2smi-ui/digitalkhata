<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dua & Timeline History</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Amiri&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root { --line: #27ae60; --bg: #ffffff; --text: #333; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); }

        header { padding: 15px 20px; background: #fff; display: flex; justify-content: space-between; border-bottom: 2px solid #f0f0f0; position: sticky; top: 0; z-index: 1000; }
        .logo { font-weight: 600; color: var(--line); }

        /* Timeline & Category */
        .filter-container { display: flex; justify-content: center; gap: 10px; padding: 15px; flex-wrap: wrap; }
        .filter-btn { padding: 5px 15px; border-radius: 20px; border: 1px solid var(--line); background: none; cursor: pointer; color: var(--line); }
        .filter-btn.active { background: var(--line); color: #fff; }

        .timeline { position: relative; max-width: 800px; margin: 20px auto; padding-bottom: 100px; }
        .timeline::before { content: ''; position: absolute; top: 0; bottom: 0; left: 95px; width: 2px; background: var(--line); }
        
        .event-row { display: flex; margin-bottom: 40px; opacity: 0; transform: translateY(20px); transition: 0.5s; cursor: pointer; }
        .event-row.show { opacity: 1; transform: translateY(0); }
        .date-col { width: 85px; text-align: right; padding-right: 15px; color: var(--line); font-weight: 600; font-size: 0.85rem; }
        .content-col { flex: 1; padding-left: 35px; border-left: 0px; }
        .content-col h3 { margin-bottom: 5px; color: #2c3e50; }

        /* Lightbox & Slider */
        .card-overlay { display: none; position: fixed; z-index: 5000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); align-items: center; justify-content: center; }
        .slider-container { width: 90%; max-width: 500px; position: relative; }
        .active-card { background: white; padding: 25px; border-radius: 20px; width: 100%; position: relative; overflow: hidden; }
        .active-card h2 { margin: 10px 0; }
        .arabic-text { font-family: 'Amiri', serif; font-size: 1.8rem; direction: rtl; margin: 15px 0; color: #222; }

        /* Controls */
        .nav-btn { background: rgba(255,255,255,0.1); color: white; border: none; font-size: 30px; cursor: pointer; padding: 15px; position: absolute; top: 50%; transform: translateY(-50%); border-radius: 50%; }
        .prev { left: -60px; } .next { right: -60px; }
        .close-overlay { position: absolute; top: 20px; right: 30px; color: white; font-size: 40px; cursor: pointer; }
        
        .audio-btn { background: var(--line); color: white; border: none; padding: 8px 20px; border-radius: 50px; cursor: pointer; margin-top: 15px; width: 100%; font-weight: 600; }
        .btn-card-share { margin-top: 10px; width: 100%; padding: 10px; border-radius: 10px; border: none; background: #34495e; color: white; cursor: pointer; }

        /* Bismillah & Themes */
        .bismillah-container { text-align: center; font-size: 2rem; color: var(--line); animation: glow 2s infinite alternate; padding: 10px; font-family: 'Amiri', serif; }
        @keyframes glow { from { text-shadow: 0 0 5px #27ae60; } to { text-shadow: 0 0 20px #2ecc71; } }
        #colorPicker { display: flex; gap: 8px; justify-content: center; margin: 15px 0; flex-wrap: wrap; }
        .color-circle { width: 25px; height: 25px; border-radius: 50%; cursor: pointer; border: 2px solid #ddd; }

        @media (max-width: 600px) {
            .timeline::before { left: 45px; }
            .date-col { width: 40px; font-size: 0.7rem; }
            .prev, .next { top: auto; bottom: -80px; }
            .prev { left: 20%; } .next { right: 20%; }
        }
    </style>
</head>
<body>

<div id="cardLightbox" class="card-overlay">
    <span class="close-overlay" onclick="closeLightbox()">&times;</span>
    <div class="slider-container">
        <button class="nav-btn prev" onclick="changeSlide(-1)">&#10094;</button>
        <div id="activeCardContent" class="active-card">
            </div>
        <button class="nav-btn next" onclick="changeSlide(1)">&#10095;</button>
    </div>
</div>

<header>
    <div class="logo">Dua Timeline App</div>
    <div onclick="alert('Menu Coming Soon')" style="font-size: 1.5rem; cursor: pointer;">☰</div>
</header>

<div class="bismillah-container">﷽</div>

<div class="filter-container">
    <button class="filter-btn active" onclick="filterDua('All', this)">All</button>
    <button class="filter-btn" onclick="filterDua('Hajj', this)">Hajj</button>
    <button class="filter-btn" onclick="filterDua('Travel', this)">Travel</button>
    <button class="filter-btn" onclick="filterDua('Daily', this)">Daily</button>
</div>

<div class="timeline" id="mainTimeline"></div>

<div id="watermarkBox" style="display:none; text-align:center; margin-top:20px; border-top:1px solid #eee; padding-top:10px;">
    <p style="font-size:0.8rem; color:#27ae60; font-weight:600;">Dua Timeline Prophet</p>
    <p style="font-size:0.6rem; color:#999;">Shared via Dua App #Hajj2026</p>
</div>

<script>
    const eventFiles = ['event1.html', 'dua2.html']; // Apni files yahan add karein
    let allEventsData = [];
    let currentSlideIndex = 0;
    const themes = [
        { bg: "#ffffff", text: "#2c3e50" }, { bg: "#f9f1e7", text: "#5d4037" },
        { bg: "#e8f5e9", text: "#1b5e20" }, { bg: "#2c3e50", text: "#ffffff" }
    ];

    async function loadEvents() {
        const container = document.getElementById('mainTimeline');
        for (let i = 0; i < eventFiles.length; i++) {
            try {
                const response = await fetch(eventFiles[i]);
                const html = await response.text();
                const doc = new DOMParser().parseFromString(html, 'text/html');

                const data = {
                    no: doc.querySelector('.dua-no')?.innerText || (i+1),
                    title: doc.querySelector('h1')?.innerText || 'Dua',
                    arabic: doc.querySelector('.arabic')?.innerText || '',
                    hindi: doc.querySelector('.hindi')?.innerText || '',
                    urdu: doc.querySelector('.urdu')?.innerText || '',
                    category: doc.querySelector('.category')?.innerText || 'Daily',
                    file: eventFiles[i]
                };
                allEventsData.push(data);

                const row = document.createElement('div');
                row.className = 'event-row';
                row.setAttribute('data-category', data.category);
                row.onclick = () => openLightbox(i);
                row.innerHTML = `
                    <div class="date-col">Dua ${data.no}</div>
                    <div class="content-col">
                        <h3>${data.title}</h3>
                        <p style="color:#777; font-size:0.8rem;">${data.category}</p>
                    </div>
                `;
                container.appendChild(row);
                setTimeout(() => row.classList.add('show'), i * 150);
            } catch (e) { console.error(e); }
        }
    }

    function openLightbox(index) {
        currentSlideIndex = index;
        document.getElementById('cardLightbox').style.display = 'flex';
        updateLightboxContent();
    }

    function updateLightboxContent() {
        const data = allEventsData[currentSlideIndex];
        const container = document.getElementById('activeCardContent');
        
        container.innerHTML = `
            <div id="captureArea">
                <span class="dua-no-label" style="color:var(--line); font-weight:600;">Dua #${data.no}</span>
                <h2 id="cardTitle">${data.title}</h2>
                <div class="arabic-text">${data.arabic}</div>
                <p style="margin-bottom:10px;"><b>Hindi:</b> ${data.hindi}</p>
                <p><b>Urdu:</b> ${data.urdu}</p>
                <div id="watermarkInCard" style="display:none"></div>
            </div>
            
            <div id="ui-elements">
                <div id="colorPicker"></div>
                <button class="audio-btn" onclick="playTTS()">🔊 Listen Dua</button>
                <button class="btn-card-share" onclick="shareAsImage()">📸 Share Image</button>
            </div>
        `;
        setupColorPicker();
    }

    function playTTS() {
        window.speechSynthesis.cancel();
        const data = allEventsData[currentSlideIndex];
        const msg = new SpeechSynthesisUtterance(data.hindi);
        msg.lang = 'hi-IN';
        window.speechSynthesis.speak(msg);
    }

    function setupColorPicker() {
        const picker = document.getElementById('colorPicker');
        themes.forEach(t => {
            const div = document.createElement('div');
            div.className = 'color-circle';
            div.style.background = t.bg;
            div.onclick = () => {
                const card = document.getElementById('activeCardContent');
                card.style.background = t.bg;
                card.style.color = t.text;
                card.querySelectorAll('h2, p, div').forEach(el => el.style.color = t.text);
            };
            picker.appendChild(div);
        });
    }

    async function shareAsImage() {
        const ui = document.getElementById('ui-elements');
        const watermark = document.getElementById('watermarkBox');
        const captureArea = document.getElementById('activeCardContent');
        
        // Hide UI & Show Watermark
        ui.style.display = 'none';
        const wmClone = watermark.cloneNode(true);
        wmClone.style.display = 'block';
        captureArea.appendChild(wmClone);

        const canvas = await html2canvas(captureArea, { scale: 2 });
        canvas.toBlob(blob => {
            const file = new File([blob], 'dua.png', { type: 'image/png' });
            if (navigator.share) {
                navigator.share({ files: [file], title: 'Dua' });
            }
        });

        // Restore UI
        ui.style.display = 'block';
        captureArea.removeChild(wmClone);
    }

    function filterDua(cat, btn) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.event-row').forEach(row => {
            row.style.display = (cat === 'All' || row.getAttribute('data-category') === cat) ? 'flex' : 'none';
        });
    }

    function changeSlide(n) {
        currentSlideIndex = (currentSlideIndex + n + allEventsData.length) % allEventsData.length;
        updateLightboxContent();
    }

    function closeLightbox() {
        document.getElementById('cardLightbox').style.display = 'none';
        window.speechSynthesis.cancel();
    }

    window.onload = loadEvents;
</script>
</body>
</html>
