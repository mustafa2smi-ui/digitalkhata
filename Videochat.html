<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MdVideoCall - Quick Connect</title>
    <script src='https://meet.jit.si/external_api.js'></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .header { padding: 20px; text-align: center; background: #1f1f1f; }
        #setup { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        input { width: 80%; padding: 15px; margin-bottom: 15px; border-radius: 10px; border: none; font-size: 16px; text-align: center; }
        button { background: #28a745; color: white; border: none; padding: 15px 30px; border-radius: 10px; font-size: 18px; font-weight: bold; width: 85%; cursor: pointer; }
        #meet-container { flex-grow: 1; display: none; width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div class="header">
        <h2 style="margin:0;">MdVideoCall</h2>
    </div>

    <div id="setup">
        <h3>Meeting Start Karein</h3>
        <p style="color: #bbb; text-align: center; margin-bottom: 20px;">Koi bhi unique naam likhein aur turant connect hon.</p>
        <input type="text" id="roomName" placeholder="e.g. MyPersonalCall123">
        <button onclick="startCall()">Call Join Karein</button>
    </div>

    <div id="meet-container"></div>

    <script>
        function startCall() {
            let room = document.getElementById('roomName').value.trim();
            if (!room) { alert("Kripya Room Name likhein!"); return; }

            // Spaces hatane ke liye taaki URL break na ho
            room = room.replace(/\s+/g, '-');

            document.getElementById('setup').style.display = 'none';
            document.getElementById('meet-container').style.display = 'block';

            const domain = 'meet.jit.si';
            const options = {
                roomName: room,
                parentNode: document.querySelector('#meet-container'),
                // Yeh settings aapko direct room ka moderator bana degi bina kisi login ke
                configOverwrite: { 
                    startWithAudioMuted: false,
                    prejoinPageEnabled: false, // Prejoin screen hata di taaki direct call start ho
                    disableDeepLinking: true   // Mobile app par redirect hone se rokega, browser me hi chalega
                },
                interfaceConfigOverwrite: { 
                    TOOLBAR_BUTTONS: ['microphone', 'camera', 'hangup', 'chat', 'tileview', 'raisehand'] 
                }
            };
            const api = new JitsiMeetExternalAPI(domain, options);
        }
    </script>
</body>
</html>
