<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MdVideoCall - Mobile App</title>
    <script crossorigin src="https://unpkg.com/@daily-co/daily-js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .container { text-align: center; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 90%; }
        input { width: 80%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; }
        button { background: #007bff; color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-size: 16px; width: 85%; }
        #call-frame { width: 100%; height: 80vh; border: none; display: none; }
    </style>
</head>
<body>

    <div class="container" id="setup">
        <h2>Video Call</h2>
        <p>Room Link yahan paste karein:</p>
        <input type="text" id="room-url" placeholder="https://yourname.daily.co/roomname">
        <button onclick="joinCall()">Call Join Karein</button>
        <p style="font-size: 12px; color: 666;">(Pehle daily.co par free account banakar room link generate karein)</p>
    </div>

    <iframe id="call-frame"></iframe>

    <script>
        function joinCall() {
            const url = document.getElementById('room-url').value;
            if (!url) { alert("Please enter room URL"); return; }

            document.getElementById('setup').style.display = 'none';
            const callFrame = document.getElementById('call-frame');
            callFrame.style.display = 'block';

            const callObject = window.DailyIframe.createFrame(callFrame);
            callObject.join({ url: url });
        }
    </script>
</body>
</html>
