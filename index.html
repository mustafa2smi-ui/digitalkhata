function addVal(v) {
    vibrate();
    const operators = ['+', '-', '*', '/'];
    const lastChar = currentExp.slice(-1);

    if (operators.includes(lastChar) && operators.includes(v)) {
        currentExp = currentExp.slice(0, -1) + v;
    } else if (currentExp === "" && operators.includes(v) && v !== '-') {
        return;
    } else {
        currentExp += v;
    }

    const expDisplay = document.getElementById('exp-view');
    expDisplay.innerText = currentExp;

    // --- YE LINE ADD KAREIN (Auto-Scroll to Right) ---
    expDisplay.scrollLeft = expDisplay.scrollWidth;
}

// 3. Gallery Render with Printer Button
function renderGallery() {
    const grid = document.getElementById('gallery-grid');
    const bills = JSON.parse(localStorage.getItem('myBills') || "[]");
    grid.innerHTML = bills.length === 0 ? "<p style='font-size:11px; grid-column:span 2;'>No history.</p>" : "";
    
    bills.slice(0, 6).forEach(bill => {
        grid.innerHTML += `
            <div class="gallery-item" style="background:#fff; border-radius:10px; padding:5px; border:1px solid #ddd;">
                <img src="${bill.image}" onclick="viewFullImage('${bill.image}')" style="width:100%; height:70px; object-fit:cover; border-radius:5px;">
                <div style="padding:5px; font-size:10px;">
                    <b>${bill.name}</b><br><span style="color:#059669; font-weight:bold;">${bill.total}</span>
                    <div class="gallery-controls">
                        <i class="fas fa-trash" onclick="deleteBill(${bill.id})" style="color:#ef4444;"></i>
                        <i class="fas fa-print" onclick="printBill('${bill.image}')" style="color:#64748b;"></i>
                        <i class="fab fa-whatsapp" onclick="shareBill('${bill.image}', '${bill.name}', '${bill.total}')" style="color:#25d366;"></i>
                    </div>
                </div>
            </div>`;
    });
}

    // 2. Updated ADD/UPDATE Item Function
function addItem() {
    try {
        let rawPrice = eval(currentExp.replace(/[^-+*/.0-9]/g, ''));
        if(rawPrice == undefined) return;

        let name = document.getElementById('itemName').value || "Item " + (items.length + 1);
        let dP = parseFloat(document.getElementById('itemDisc').value) || 0;
        let gP = parseFloat(document.getElementById('itemGst').value) || 0;

        let afterDisc = rawPrice - (rawPrice * dP / 100);
        let finalPrice = afterDisc + (afterDisc * gP / 100);

        let itemData = { 
            name: name, 
            price: finalPrice, 
            detail: currentExp,
            dP: dP, // Percentages save kar rahe hain taaki edit mein kaam aaye
            gP: gP,
            taxInfo: `G:${gP}% | D:${dP}%` 
        };

        if (editIndex > -1) {
            // Agar edit mode hai toh purane ko replace karein
            items[editIndex] = itemData;
            editIndex = -1; // Reset edit mode
            const addBtn = document.querySelector('.n-btn-p');
            addBtn.innerHTML = '<i class="fas fa-plus"></i>';
            addBtn.style.background = ""; // Original color
        } else {
            // Naya item add karein
            items.push(itemData);
        }

        updateList();
        resetInputs();
        
    } catch(e) { alert("Calculation error!"); }
}

// 1. EDIT Function (Item par click karne par data wapas boxes mein)

    vibrate();
    editIndex = idx;
    let item = items[idx];
    
    // Data ko wapas inputs mein bharna
    document.getElementById('itemName').value = item.name;
    document.getElementById('itemDisc').value = item.dP; // Humne item object mein dP aur gP save kiya hai
    document.getElementById('itemGst').value = item.gP;
    
    currentExp = item.detail; // Purana calculation wapas
    document.getElementById('exp-view').innerText = currentExp;
    
    // "ADD" button ko "UPDATE" button mein badalna
    const addBtn = document.querySelector('.n-btn-p'); // Blue add button
    addBtn.innerHTML = '<i class="fas fa-sync-alt"></i>';
    addBtn.style.background = "#f59e0b"; // Orange color for update
}

function resetInputs() {
    currentExp = ""; 
    document.getElementById('exp-view').innerText = "0";
    document.getElementById('itemName').value = "";
    // Hum GST/Disc ko reset nahi kar rahe taki default wahi rahe
}

    function deleteBill(id) {
        if(confirm("Delete?")) {
            let bills = JSON.parse(localStorage.getItem('myBills') || "[]").filter(b => b.id !== id);
            localStorage.setItem('myBills', JSON.stringify(bills));
            renderGallery();
        }
    }

    function viewFullImage(img) {
        let win = window.open();
        win.document.write(`<img src="${img}" style="width:100%">`);
    }

    function exportToCSV() {
        let name = document.getElementById('custName').value || 'Grahak';
        let csv = "Item,Calculation,Price\n";
        items.forEach(it => csv += `${it.name},${it.detail},${it.price}\n`);
        csv += `\nTotal,,${document.getElementById('final-baki').innerText}`;
        let link = document.createElement("a");
        link.href = "data:text/csv;charset=utf-8," + encodeURI(csv);
        link.download = `${name}.csv`;
        link.click();
    }

function quickTextShare() {
    vibrate();
    const name = document.getElementById('custName').value || 'Grahak';
    const total = document.getElementById('final-baki').innerText;
    const itemsCount = items.length;
    
    if(itemsCount === 0) {
        alert("Pehle kuch items add karein!");
        return;
    }

    let itemDetails = items.map(it => `• ${it.name}: ₹${it.price}`).join('\n');
    
    const msg = `*Digital Khata Report* 📝\n\n*Grahak:* ${name}\n*Items:* ${itemsCount}\n\n${itemDetails}\n\n*Total Baki: ${total}*\n\n_Banaye apna digital bill yahan:_ \n${window.location.href}`;

    const whatsappUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`;
    window.open(whatsappUrl, '_blank');
}

// 2. Updated Image Share with stronger Caption
async function shareBill(imgBase64, name, total) {
    vibrate();
    const siteLink = window.location.href; 
    const msg = `*Digital Bill for ${name}*\nTotal: ${total}\n\nCheck online: ${siteLink}`;
    
    try {
        const response = await fetch(imgBase64);
        const blob = await response.blob();
        const file = new File([blob], `${name}_bill.png`, { type: 'image/png' });

        if (navigator.canShare && navigator.share) {
            await navigator.share({
                title: 'Digital Bill',
                text: msg, // Ye caption hai jo image ke niche jana chahiye
                files: [file]
            });
        } else {
            // Fallback for older browsers
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
        }
    } catch (err) {
        console.error("Share failed:", err);
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
    }
}
