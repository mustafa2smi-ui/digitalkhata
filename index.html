<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Calculator Project</title>
<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f4f4f4;
}
header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:50px;
  background:#222;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  z-index:10;
}
header .menu{font-size:22px;cursor:pointer;}

main{
  padding:60px 10px 220px; /* header + keypad space */
}

.inputs{
  display:flex;
  gap:10px;
  margin-bottom:10px;
}
.inputs input{
  flex:1;
  padding:10px;
  font-size:18px;
}

.history{
  background:#fff;
  padding:10px;
  border-radius:6px;
  max-height:300px;
  overflow:auto;
}
.history div{border-bottom:1px solid #ddd;padding:4px 0;}
.total{margin-top:10px;font-weight:bold;}

/* Fixed keypad */
.keypad{
  position:fixed;
  bottom:60px;
  left:0;
  right:0;
  background:#fff;
  border-top:1px solid #ccc;
  padding:10px;
}
.keypad button{
  width:23%;
  margin:1%;
  padding:15px 0;
  font-size:18px;
}

.bottom-buttons{
  position:fixed;
  bottom:30px;
  left:0;
  right:0;
  display:flex;
  justify-content:space-around;
}

footer{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:30px;
  background:#222;
  color:#fff;
  text-align:center;
  font-size:12px;
  line-height:30px;
}
</style>
</head>
<body>

<header>
  <div class="menu">☰</div>
  <div>Simple Calculator Project</div>
</header>

<main>
  <div class="inputs">
    <input id="screen1" placeholder="Input 1" readonly>
    <input id="screen2" placeholder="Input 2" readonly>
  </div>

  <div class="history" id="history"></div>
  <div class="total" id="total">Total: 0</div>
</main>

<div class="keypad">
  <button onclick="press('7')">7</button>
  <button onclick="press('8')">8</button>
  <button onclick="press('9')">9</button>
  <button onclick="setOp('+')">+</button>

  <button onclick="press('4')">4</button>
  <button onclick="press('5')">5</button>
  <button onclick="press('6')">6</button>
  <button onclick="setOp('-')">-</button>

  <button onclick="press('1')">1</button>
  <button onclick="press('2')">2</button>
  <button onclick="press('3')">3</button>
  <button onclick="setOp('*')">×</button>

  <button onclick="clearAll()">C</button>
  <button onclick="press('0')">0</button>
  <button onclick="calculate()">=</button>
</div>

<div class="bottom-buttons">
  <button onclick="alert('Save as Image')">Save Image</button>
  <button onclick="alert('Export CSV')">Export CSV</button>
</div>

<footer>
  Demo Footer Link
</footer>

<script>
let a = '';
let b = '';
let op = '';
let total = 0;

function press(val){
  if(op===''){ a += val; screen1.value = a; }
  else{ b += val; screen2.value = b; }
}

function setOp(o){ if(a!==''){ op = o; }}

function calculate(){
  if(a!=='' && b!==''){
    let res = 0;
    if(op==='+') res = Number(a)+Number(b);
    if(op==='-') res = Number(a)-Number(b);
    if(op==='*') res = Number(a)*Number(b);

    history.innerHTML += `<div>${a} ${op} ${b} = ${res}</div>`;
    total += res;
    document.getElementById('total').innerText = 'Total: '+total;
    a = b = op = '';
    screen1.value = screen2.value = '';
  }
}

function clearAll(){ a=b=op=''; screen1.value=screen2.value=''; }
</script>
</body>
</html>
