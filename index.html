<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Digital Khata Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
:root { --p: #2563eb; --bg: #f1f5f9; }
* { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; transition: 0.2s; margin: 0; padding: 0; }
body, html { height: 100dvh; width: 100vw; overflow: hidden; background: var(--bg); position: fixed; }
#calc-page, #homepage { max-width: 500px; margin: auto; background: #fff; position: relative; height: 100dvh; display: flex; flex-direction: column; }
#homepage { justify-content: center; align-items: center; text-align: center; padding: 20px; }
#calc-page { display: none; }

.calc-header { background: var(--p); padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; color: white; }
.app-body { flex: 1; overflow-y: auto; padding: 10px; background: var(--bg); }

/* Compact Input Row */
.input-row-container { display: flex; gap: 4px; margin-bottom: 8px; }
#itemName { flex: 2.5; padding: 8px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; outline: none; }
#itemDisc, #itemGst { width: 45px; padding: 8px 2px; border: 1px solid #ddd; border-radius: 8px; text-align: center; font-size: 12px; outline: none; }

.cust-card, .footer-billing, .history-section { background: #fff; padding: 12px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 8px; border: 1px solid #e2e8f0; }
.cust-card input { border: none; border-bottom: 2px solid #f1f5f9; width: 100%; font-size: 15px; font-weight: bold; padding: 5px 0; outline: none; }

.items-list { max-height: 160px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 10px; padding: 8px; background: #fff; margin-bottom: 8px;
    display: flex;
    flex-direction: column;
    scroll-behavior: smooth; /* Smooth scroll ke liye */ }
.item-row { background: #fff; padding: 6px 10px; border-radius: 8px; margin-bottom: 5px; border-left: 4px solid var(--p); cursor: pointer; }
.row-main { display: flex; justify-content: space-between; font-weight: bold; font-size: 13px; }

.bill-input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.square-box { border: 1px solid #e2e8f0; padding: 4px; border-radius: 8px; text-align: center; background: #fff; }
.square-box label { font-size: 8px; font-weight: bold; color: #64748b; display: block; }
.square-box input { width: 100%; border: none; text-align: center; font-weight: bold; font-size: 14px; outline: none; }
.final-total-box { background: #fee2e2; padding: 8px 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px dashed #ef4444; }

.app-fixed-controls { background: #fff; padding: 8px 10px 15px; border-radius: 15px 15px 0 0; box-shadow: 0 -5px 15px rgba(0,0,0,0.08); }
.display-box { background: #000; padding: 10px; border-radius: 10px; text-align: right; margin-bottom: 8px; }
#exp-view { font-size: 22px; font-weight: 800; color: #ffca28; overflow-x: auto; white-space: nowrap; scrollbar-width: none;
    /* ... baki purana code ... */
    scroll-behavior: smooth; /* Isse scroll smooth hoga */
    display: block; 
    direction: ltr; /* Text left to right chalega */
}
#total-view { font-size: 14px; color: #64b5f6; }

.numpad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.n-btn { height: 42px; font-size: 16px; border-radius: 8px; border: none; background: #f1f5f9; font-weight: 600; }
.op-btn { background: #e2e8f0; color: var(--p); }
.eq-btn { background: var(--p); color: white; font-size: 14px; }

.action-row { display: flex; gap: 4px; margin-top: 8px; }
.action-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; color: white; font-weight: bold; font-size: 11px; display: flex; align-items: center; justify-content: center; gap: 4px; }

.settings-drawer { position: fixed; top: 0; right: -100%; width: 80%; max-width: 300px; height: 100dvh; background: #fff; z-index: 10001; transition: 0.3s; padding: 20px; box-shadow: -5px 0 20px rgba(0,0,0,0.1); }
.settings-drawer.open { right: 0; }

.screenshot-mode .app-fixed-controls, .screenshot-mode .calc-header { display: none !important; }
/* Manage Inventory Section */
.inventory-manager {
    margin-top: 15px;
    border-top: 2px dashed #e2e8f0;
    padding-top: 15px;
}
.manage-item-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px;
    background: #f8fafc;
    border-radius: 8px;
    margin-bottom: 5px;
    font-size: 13px;
}
.del-btn {
    color: #ef4444;
    padding: 5px 10px;
    cursor: pointer;
}
</style>
</head>
<body>

<div id="settingsDrawer" class="settings-drawer">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2 style="font-size:16px; color:var(--p);">Inventory</h2>
        <i class="fas fa-times" onclick="toggleSettings()"></i>
    </div>
    <button class="action-btn" onclick="addToInventory()" style="background:var(--p); width:100%; margin-bottom:10px;">Save Current to List</button>
    <button class="action-btn" onclick="exportInventory()" style="background:#475569; width:100%; margin-bottom:10px;">Backup List</button>
    <button class="action-btn" onclick="document.getElementById('importFile').click()" style="background:#475569; width:100%;">Restore List</button>
    <div class="inventory-manager">
    <label style="font-size:12px; font-weight:bold; color:var(--p);"><i class="fas fa-list"></i> Manage Saved Items</label>
    <div id="full-inventory-list" style="max-height: 200px; overflow-y: auto; margin-top: 10px;">
        </div>
    </div>
    <input type="file" id="importFile" style="display:none" onchange="importInventory(this)">
</div>

<div id="homepage">
    <div style="background:var(--p); color:white; width:70px; height:70px; border-radius:20px; display:flex; align-items:center; justify-content:center; font-size:35px; margin-bottom:15px;"><i class="fas fa-calculator"></i></div>
    <h1 style="font-size:24px;">Digital Khata</h1>
    <button onclick="goToCalc()" style="background:var(--p); color:white; border:none; padding:15px 35px; border-radius:50px; font-size:15px; margin-top:20px;">Start Billing <i class="fas fa-arrow-right"></i></button>
</div>

<div id="calc-page">
    <div class="calc-header">
        <div onclick="location.reload()"><i class="fas fa-arrow-left"></i> <b>Billing</b></div>
        <div><i class="fas fa-cog" onclick="toggleSettings()" style="margin-right:15px;"></i><i class="fas fa-share-nodes" onclick="shareWebsite()"></i></div>
    </div>

    <div class="app-body" id="bill-area">
        <div class="cust-card">
            <input type="text" id="custName" placeholder="Customer Name">
            <div id="dateDisplay" style="font-size:10px; color:#94a3b8; margin-top:3px;"></div>
        </div>
        <div class="items-list" id="items-list"></div>
        <div class="footer-billing">
            <div class="bill-input-grid">
                <div class="square-box"><label>OLD BAKI</label><input type="number" id="oldBal" oninput="calculateFinal()"></div>
                <div class="square-box"><label>RECEIVED</label><input type="number" id="cashPaid" oninput="calculateFinal()"></div>
            </div>
            <div class="final-total-box"><b>TOTAL BAKI</b><span id="final-baki">₹ 0.00</span></div>
        </div>
        <div id="gallery-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:8px;"></div>
    </div>

    <div class="app-fixed-controls">
        <div class="input-row-container">
            <input type="text" id="itemName" list="inventory-list" oninput="checkAutoFill(this.value)" placeholder="Item Name">
            <datalist id="inventory-list"></datalist>
            <input type="number" id="itemDisc" placeholder="D%">
            <input type="number" id="itemGst" placeholder="G%">
        </div>
        <div class="display-box"><div id="exp-view">0</div><div id="total-view">₹ 0.00</div></div>
        <div class="numpad">
            <button class="n-btn op-btn" onclick="smartAC()">AC</button>
            <button class="n-btn op-btn" onclick="addVal('/')">/</button>
            <button class="n-btn op-btn" onclick="addVal('*')">×</button>
            <button class="n-btn op-btn" onclick="back()"><i class="fas fa-backspace"></i></button>
            <button class="n-btn" onclick="addVal('7')">7</button><button class="n-btn" onclick="addVal('8')">8</button><button class="n-btn" onclick="addVal('9')">9</button><button class="n-btn op-btn" onclick="addVal('-')">-</button>
            <button class="n-btn" onclick="addVal('4')">4</button><button class="n-btn" onclick="addVal('5')">5</button><button class="n-btn" onclick="addVal('6')">6</button><button class="n-btn op-btn" onclick="addVal('+')">+</button>
            <button class="n-btn" onclick="addVal('1')">1</button><button class="n-btn" onclick="addVal('2')">2</button><button class="n-btn" onclick="addVal('3')">3</button>
            <button class="n-btn eq-btn" onclick="addItem()">ADD (=)</button>
            <button class="n-btn" onclick="addVal('0')">0</button><button class="n-btn" onclick="addVal('.')">.</button>
            <button class="action-btn" onclick="saveBill()" style="background:#059669;"><i class="fas fa-camera"></i> SAVE</button>
            <button class="action-btn" onclick="exportToCSV()" style="background:#2563eb;"><i class="fas fa-file-csv"></i> CSV</button>
        </div>
        <div class="action-row">
            <button class="action-btn" onclick="quickTextShare()" style="background:#25d366; width:100%;"><i class="fab fa-whatsapp"></i> QUICK WHATSAPP MESSAGE</button>
        </div>
    </div>
</div>

<script>
let currentExp = "", items = [], editIndex = -1;
let myInventory = JSON.parse(localStorage.getItem('myInventory')) || [];

function loadInventory() {
    const list = document.getElementById('inventory-list');
    list.innerHTML = "";
    myInventory.forEach(it => { let opt = document.createElement('option'); opt.value = it.name; list.appendChild(opt); });
}

function checkAutoFill(val) {
    const found = myInventory.find(i => i.name.toLowerCase() === val.toLowerCase());
    if (found) {
        currentExp = found.price.toString();
        document.getElementById('exp-view').innerText = currentExp;
        document.getElementById('itemGst').value = found.gst;
        document.getElementById('itemDisc').value = found.disc;
    }
}
/*
function toggleSettings() { document.getElementById('settingsDrawer').classList.toggle('open'); }
*/
    function toggleSettings() {
    vibrate();
    const drawer = document.getElementById('settingsDrawer');
    drawer.classList.toggle('open');
    if(drawer.classList.contains('open')) {
        renderFullInventory(); // Drawer khulte hi list load hogi
    }
}

function addToInventory() {
    let name = document.getElementById('itemName').value;
    let price = currentExp;
    let gst = document.getElementById('itemGst').value || 0;
    let disc = document.getElementById('itemDisc').value || 0;
    if(!name || !price) { alert("Rate aur Naam bharein"); return; }
    const idx = myInventory.findIndex(i => i.name.toLowerCase() === name.toLowerCase());
    if(idx > -1) { if(!confirm("Purana rate update karein?")) return; myInventory[idx] = {name, price, gst, disc}; }
    else { myInventory.push({name, price, gst, disc}); }
    localStorage.setItem('myInventory', JSON.stringify(myInventory));
    loadInventory(); alert("Saved! ✅");
}

function exportInventory() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(myInventory));
    const dl = document.createElement('a'); dl.href = dataStr; dl.download = "MyRateList.json"; dl.click();
}

function importInventory(input) {
    const reader = new FileReader();
    reader.onload = function(){
        myInventory = JSON.parse(reader.result);
        localStorage.setItem('myInventory', JSON.stringify(myInventory));
        loadInventory(); alert("Restored! ✅");
    };
    reader.readAsText(input.files[0]);
}

function goToCalc() {
    document.getElementById('homepage').style.display = 'none';
    document.getElementById('calc-page').style.display = 'flex';
    document.getElementById('dateDisplay').innerText = new Date().toLocaleDateString('hi-IN');
    loadInventory();
}

function addVal(v) { currentExp += v; document.getElementById('exp-view').innerText = currentExp; }
function back() { currentExp = currentExp.slice(0, -1); document.getElementById('exp-view').innerText = currentExp || "0"; }
/*
    function addVal(v) {
    vibrate();
    const ops = ['+', '-', '*', '/'];
    const last = currentExp.slice(-1);
    
    if (ops.includes(last) && ops.includes(v)) {
        currentExp = currentExp.slice(0, -1) + v;
    } else {
        currentExp += v;
    }
    
    const display = document.getElementById('exp-view');
    display.innerText = currentExp;

    // Yeh line screen ko auto-scroll karegi right side mein
    display.scrollLeft = display.scrollWidth; 
}
*/
function addItem() {
    try {
        let rawPrice = eval(currentExp.replace(/[^-+*/.0-9]/g, ''));
        let name = document.getElementById('itemName').value || "Item " + (items.length + 1);
        let dP = parseFloat(document.getElementById('itemDisc').value) || 0;
        let gP = parseFloat(document.getElementById('itemGst').value) || 0;
        let finalPrice = (rawPrice - (rawPrice * dP / 100)) * (1 + gP / 100);
        let data = { name, price: finalPrice, detail: currentExp, dP, gP };
        if (editIndex > -1) { items[editIndex] = data; editIndex = -1; document.querySelector('.eq-btn').innerText = "ADD (=)"; }
        else { items.push(data); }
        updateList(); currentExp = ""; document.getElementById('exp-view').innerText = "0"; document.getElementById('itemName').value = "";
    } catch(e) { alert("Error!"); }
}

function updateList() {
    const list = document.getElementById('items-list');
    list.innerHTML = items.length === 0 ? "<p style='text-align:center;font-size:12px;color:#999;'>Khali hai</p>" : "";
    items.forEach((it, idx) => {
        list.innerHTML += `<div class="item-row" onclick="editItem(${idx})">
            <div class="row-main"><span>${it.name}</span> <span>₹${it.price.toFixed(2)}</span></div>
            <div style="font-size:9px;color:#666;">G:${it.gP}% D:${it.dP}% (${it.detail}) <i class="fas fa-trash" onclick="event.stopPropagation();delItem(${idx})" style="float:right;color:red;"></i></div>
        </div>`;
    });
      // Auto-scroll logic niche add karein
    const listDiv = document.getElementById('items-list');
    listDiv.scrollTop = listDiv.scrollHeight; 
    calculateFinal();
}

function calculateFinal() {
    let sub = items.reduce((a, b) => a + b.price, 0);
    let old = parseFloat(document.getElementById('oldBal').value) || 0;
    let paid = parseFloat(document.getElementById('cashPaid').value) || 0;
    document.getElementById('final-baki').innerText = "₹ " + (sub + old - paid).toFixed(2);
    document.getElementById('total-view').innerText = "Total: ₹ " + sub.toFixed(2);
}

function delItem(i) { items.splice(i,1); updateList(); }
function editItem(i) {
    editIndex = i; let it = items[i];
    document.getElementById('itemName').value = it.name;
    document.getElementById('itemDisc').value = it.dP;
    document.getElementById('itemGst').value = it.gP;
    currentExp = it.detail; document.getElementById('exp-view').innerText = currentExp;
    document.querySelector('.eq-btn').innerText = "UPDATE";
}

function smartAC() {
    if(confirm("Sab clear karein?")) {
        items = []; currentExp = ""; 
        document.getElementById('itemName').value = "";
        document.getElementById('itemDisc').value = "";
        document.getElementById('itemGst').value = "";
        document.getElementById('oldBal').value = "";
        document.getElementById('cashPaid').value = "";
        updateList();
    }
}
/*
async function saveBill() {
    const area = document.getElementById('bill-area');
    area.classList.add('screenshot-mode');
    html2canvas(area, { scale: 2 }).then(canvas => {
        area.classList.remove('screenshot-mode');
        let img = canvas.toDataURL();
        let l = document.createElement('a'); l.download = "Bill.png"; l.href = img; l.click();
    });
}
*/
    async function saveBill() {
    const area = document.getElementById('bill-area');
    const controls = document.querySelector('.app-fixed-controls');
    const header = document.querySelector('.calc-header');

    // 1. Chhupane wali cheezein
    controls.style.display = 'none';
    header.style.display = 'none';
    area.style.height = 'auto'; // Area ko pura kholne ke liye
    area.style.overflow = 'visible';

    // Thoda intezar taaki UI update ho jaye
    setTimeout(() => {
        html2canvas(area, { 
            scale: 2,
            backgroundColor: "#f1f5f9", // Body bg color
            useCORS: true 
        }).then(canvas => {
            // 2. Sab wapas normal karein
            controls.style.display = 'block';
            header.style.display = 'flex';
            area.style.height = ''; 
            area.style.overflow = 'auto';

            let img = canvas.toDataURL('image/png');
            let l = document.createElement('a');
            l.download = `Bill_${Date.now()}.png`;
            l.href = img;
            l.click();
        });
    }, 100);
}

function exportToCSV() {
    let csv = "Item,Price\n";
    items.forEach(it => csv += `${it.name},${it.price.toFixed(2)}\n`);
    let dl = document.createElement('a'); dl.href = 'data:text/csv;charset=utf-8,' + encodeURI(csv);
    dl.download = 'Bill.csv'; dl.click();
}

function quickTextShare() {
    let txt = `*Bill*\n`;
    items.forEach(it => txt += `${it.name}: ₹${it.price.toFixed(2)}\n`);
    txt += `\n*Total: ${document.getElementById('final-baki').innerText}*`;
    window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(txt)}`);
}

function shareWebsite() { window.open(`https://api.whatsapp.com/send?text=${window.location.href}`); }
    function renderFullInventory() {
    const container = document.getElementById('full-inventory-list');
    container.innerHTML = myInventory.length === 0 ? "<p style='font-size:11px; color:#94a3b8;'>Koi item save nahi hai</p>" : "";
    
    myInventory.forEach((item, index) => {
        container.innerHTML += `
            <div class="manage-item-row">
                <span><b>${item.name}</b> (₹${item.price})</span>
                <i class="fas fa-trash-alt del-btn" onclick="deleteFromInventory(${index})"></i>
            </div>
        `;
    });
}

function deleteFromInventory(index) {
    if(confirm(`Kya aap "${myInventory[index].name}" ko list se hatana chahte hain?`)) {
        myInventory.splice(index, 1);
        localStorage.setItem('myInventory', JSON.stringify(myInventory));
        renderFullInventory(); // List refresh
        loadInventory(); // Datalist refresh
        vibrate();
    }
}

</script>
</body>
</html>
