<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Digital Khata Pro v3.1</title>
    <script src="https://cdn.jsdelivr.net/npm/@undecaf/barcode-detector-polyfill@latest/dist/index.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --p: #2563eb; --bg: #f1f5f9; --dark: #1e293b; --success: #059669; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; touch-action: manipulation; }
        body { background: var(--bg); overflow: hidden; position: fixed; width: 100vw; height: 100dvh; }

        #app-container { max-width: 500px; margin: auto; background: #fff; height: 100dvh; display: flex; flex-direction: column; }

        /* Header */
        .header { background: var(--p); padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; color: white; }
        
        /* Main Content Scrollable */
        .main-content { flex: 1; overflow-y: auto; padding: 10px; background: #f8fafc; }
        .bill-list { background: #fff; border-radius: 10px; border: 1px solid #e2e8f0; min-height: 80px; margin-bottom: 15px; }
        .row { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #f1f5f9; }
        .row .sn { background: var(--p); color: white; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; margin-right: 8px; }

        .total-banner { background: var(--dark); color: #ffca28; padding: 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }

        /* Fixed Bottom Controls */
        .bottom-controls { background: #fff; border-top: 1px solid #cbd5e1; padding: 8px; }
        
        /* Input Row 1: GST & Disc (Chote Boxes) */
        .extra-inputs { display: flex; gap: 4px; margin-bottom: 4px; }
        .extra-inputs div { flex: 1; display: flex; align-items: center; border: 1px solid #cbd5e1; border-radius: 6px; padding: 2px 5px; background: #fdfdfd; }
        .extra-inputs input { width: 100%; border: none; outline: none; font-size: 12px; font-weight: bold; text-align: right; background: transparent; }

        /* Input Row 2: Name, Qty, Rate */
        .main-inputs { display: flex; gap: 4px; margin-bottom: 8px; }
        .main-inputs input { padding: 10px 5px; border: 2px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; font-weight: bold; text-align: center; }

        /* Keypad */
        .keypad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
        .k-btn { height: 44px; border: none; border-radius: 6px; font-size: 18px; font-weight: bold; background: #f1f5f9; cursor: pointer; }
        .star-btn { background: var(--p) !important; color: white !important; grid-row: span 2; height: 92px; }
        
        #scan-view { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:1000; flex-direction:column; align-items:center; justify-content:center; }
        video { width: 85%; border: 2px solid var(--p); border-radius: 10px; }
    </style>
</head>
<body>

<div id="scan-view">
    <video id="video" autoplay playsinline></video>
    <button onclick="stopScanner()" style="margin-top:20px; padding:10px 40px; background:red; color:white; border:none; border-radius:50px;">CLOSE</button>
</div>

<div id="app-container">
    <div class="header">
        <div onclick="location.reload()"><i class="fas fa-store"></i> <b>Digital Khata</b></div>
        <div id="liveClock" style="font-size: 10px; text-align: center;"></div>
        <i class="fas fa-barcode" onclick="startScanner()" style="font-size:22px;"></i>
    </div>

    <div class="main-content">
        <input type="text" id="custName" placeholder="Customer Name" style="width:100%; padding:10px; margin-bottom:10px; border:1px solid #e2e8f0; border-radius:8px; outline:none; font-weight:bold;">
        
        <div class="bill-list" id="bill-list"></div>

        <div class="total-banner">
            <span id="itemCount">0 Items</span>
            <b id="grandTotal">₹ 0.00</b>
        </div>

        <div id="billGallery"></div>
    </div>

    <div class="bottom-controls">
        <div class="extra-inputs">
            <div><span style="font-size:10px; color:#64748b;">Disc%</span><input type="text" id="itemDisc" placeholder="0" readonly></div>
            <div><span style="font-size:10px; color:#64748b;">GST%</span><input type="text" id="itemGst" placeholder="0" readonly></div>
        </div>

        <div class="main-inputs">
            <input type="text" id="itemName" placeholder="Item Name" style="flex:2; text-align: left; padding-left:8px;">
            <input type="text" id="itemQty" placeholder="Qty" readonly style="width:60px;">
            <input type="text" id="itemRate" placeholder="Rate" readonly style="width:85px;">
        </div>

        <div class="keypad">
            <button class="k-btn" style="background:#e2e8f0" onclick="clearAll()">AC</button>
            <button class="k-btn" style="background:#e2e8f0" onclick="back()"><i class="fas fa-backspace"></i></button>
            <button class="k-btn" style="background:var(--success); color:white; font-size:12px;" onclick="saveBill()">SAVE CSV</button>
            <button class="k-btn" style="background:#e2e8f0" onclick="printThermal()"><i class="fas fa-print"></i></button>
            
            <button class="k-btn" onclick="press('7')">7</button>
            <button class="k-btn" onclick="press('8')">8</button>
            <button class="k-btn" onclick="press('9')">9</button>
            <button class="k-btn star-btn" onclick="handleStar()">*<br><small style="font-size:9px;">NEXT</small></button>
            
            <button class="k-btn" onclick="press('4')">4</button>
            <button class="k-btn" onclick="press('5')">5</button>
            <button class="k-btn" onclick="press('6')">6</button>

            <button class="k-btn" onclick="press('1')">1</button>
            <button class="k-btn" onclick="press('2')">2</button>
            <button class="k-btn" onclick="press('3')">3</button>
            <button class="k-btn" style="background:#e2e8f0" onclick="press('.')">.</button>

            <button class="k-btn" onclick="press('0')" style="grid-column: span 2;">0</button>
            <button class="k-btn" style="background:#e2e8f0" onclick="location.reload()"><i class="fas fa-sync"></i></button>
        </div>
    </div>
</div>

<script>
let items = [], editIndex = null, currentFocus = "itemQty";
let myInventory = JSON.parse(localStorage.getItem('myInventory')) || [
    { barcode: "123", name: "Sample Item", price: "100", gst: "18", disc: "5" } // Example data
];
let history = JSON.parse(localStorage.getItem('savedBillsHistory')) || [];

// Input Selection
document.getElementById('itemQty').onclick = () => currentFocus = "itemQty";
document.getElementById('itemRate').onclick = () => currentFocus = "itemRate";
document.getElementById('itemDisc').onclick = () => currentFocus = "itemDisc";
document.getElementById('itemGst').onclick = () => currentFocus = "itemGst";
document.getElementById('itemName').onclick = () => currentFocus = "itemName";

function press(v) {
    if(currentFocus === "itemName") return;
    document.getElementById(currentFocus).value += v;
}

function back() {
    let inp = document.getElementById(currentFocus);
    inp.value = inp.value.slice(0, -1);
}

function handleStar() {
    const qty = document.getElementById('itemQty');
    const rate = document.getElementById('itemRate');
    if (currentFocus === "itemQty") {
        if(!qty.value) qty.value = "1";
        currentFocus = "itemRate";
    } else if (currentFocus === "itemRate") {
        if (rate.value) addItem();
    } else {
        currentFocus = "itemQty";
    }
}

function addItem() {
    const n = document.getElementById('itemName').value || "Item";
    const q = parseFloat(document.getElementById('itemQty').value) || 1;
    const r = parseFloat(document.getElementById('itemRate').value) || 0;
    const d = parseFloat(document.getElementById('itemDisc').value) || 0;
    const g = parseFloat(document.getElementById('itemGst').value) || 0;

    if (r > 0) {
        // GST & Discount Calculation
        let priceAfterDisc = r - (r * (d / 100));
        let finalPrice = priceAfterDisc + (priceAfterDisc * (g / 100));
        let total = q * finalPrice;

        let obj = { name: n, qty: q, rate: r, disc: d, gst: g, total: total };
        if (editIndex !== null) { items[editIndex] = obj; editIndex = null; }
        else { items.push(obj); }
        
        updateUI();
        resetInputs();
    }
}

function updateUI() {
    const list = document.getElementById('bill-list');
    list.innerHTML = items.map((it, i) => `
        <div class="row" onclick="editRow(${i})">
            <div style="display:flex; align-items:center;">
                <div class="sn">${i + 1}</div>
                <div><b>${it.name}</b><br><small>${it.qty} x ₹${it.rate} (GST ${it.gst}%)</small></div>
            </div>
            <b>₹${it.total.toFixed(2)}</b>
        </div>`).join('');
    
    let grand = items.reduce((a, b) => a + b.total, 0);
    document.getElementById('grandTotal').innerText = "₹ " + grand.toFixed(2);
    document.getElementById('itemCount').innerText = items.length + " Items";
}

function editRow(i) {
    const it = items[i];
    document.getElementById('itemName').value = it.name;
    document.getElementById('itemQty').value = it.qty;
    document.getElementById('itemRate').value = it.rate;
    document.getElementById('itemDisc').value = it.disc;
    document.getElementById('itemGst').value = it.gst;
    editIndex = i;
    currentFocus = "itemQty";
}

function resetInputs() {
    ['itemName', 'itemQty', 'itemRate', 'itemDisc', 'itemGst'].forEach(id => document.getElementById(id).value = "");
    currentFocus = "itemQty";
}

function clearAll() { if(confirm("Clear Bill?")) { items = []; updateUI(); resetInputs(); } }

function saveBill() {
    if(items.length === 0) return;
    const name = document.getElementById('custName').value || "Cash";
    let csv = "S.No,Item,Qty,Rate,Disc%,GST%,Total\n";
    items.forEach((it, i) => csv += `${i+1},${it.name},${it.qty},${it.rate},${it.disc},${it.gst},${it.total.toFixed(2)}\n`);
    
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
    a.download = `Bill_${name}.csv`;
    a.click();
    alert("CSV Saved!");
}

// Scanner with Auto-Fill for GST/Disc
async function startScanner() {
    document.getElementById('scan-view').style.display = 'flex';
    const video = document.getElementById('video');
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = stream;
        const detector = new BarcodeDetector();
        const scan = async () => {
            const codes = await detector.detect(video);
            if (codes.length > 0) {
                stopScanner();
                let match = myInventory.find(it => it.barcode === codes[0].rawValue);
                if (match) { 
                    document.getElementById('itemName').value = match.name; 
                    document.getElementById('itemRate').value = match.price; 
                    // Auto-fill GST & Disc from Inventory
                    document.getElementById('itemGst').value = match.gst || "0";
                    document.getElementById('itemDisc').value = match.disc || "0";
                    currentFocus = "itemQty";
                }
            }
            if(document.getElementById('scan-view').style.display === 'flex') requestAnimationFrame(scan);
        };
        scan();
    } catch (e) { stopScanner(); }
}

function stopScanner() {
    const v = document.getElementById('video');
    if (v.srcObject) v.srcObject.getTracks().forEach(t => t.stop());
    document.getElementById('scan-view').style.display = 'none';
}

function startClock() {
    setInterval(() => {
        const now = new Date();
        document.getElementById('liveClock').innerHTML = now.toLocaleDateString() + "<br>" + now.toLocaleTimeString();
    }, 1000);
}

function printThermal() { alert("Printing..."); }

window.onload = startClock;
</script>
</body>
</html>
