<script>
    const quizData = {
        'Math': [
            { q: "What is 55 plus 45?", a: "100", opts: ["100", "90", "0", "80", "70"] },
            { q: "What is 12 multiplied by 2?", a: "24", opts: ["24", "12", "0", "10", "30"] }
        ],
        'G.K': [
            { q: "Who is the Prime Minister of India?", a: "Modi", opts: ["Modi", "Rahul", "0", "Amit", "Kejriwal"] }
        ]
    };

    let currentCat = 'Math';
    let qIdx = 0;
    let totalScore = 0;
    let isSpinning = false;
    let currentRotation = 0;

    function loadGame() {
        const dataList = quizData[currentCat];
        const data = dataList[qIdx];
        
        // 1) Update Position (1/20)
        document.getElementById('q-count').innerText = `${qIdx + 1} / ${dataList.length}`;
        
        // 2) Update Watermark
        document.getElementById('cat-watermark').innerText = `${currentCat.toUpperCase()}: ${dataList.length}`;
        
        document.getElementById('question-box').innerText = data.q;
        const wheel = document.getElementById('wheel');
        wheel.innerHTML = '';
        data.opts.forEach(opt => {
            const div = document.createElement('div');
            div.className = 'label';
            div.innerText = opt;
            wheel.appendChild(div);
        });
        document.getElementById('feedback').innerText = "";
    }

    // 5) Male Voice Logic
    function getMaleVoice() {
        const voices = window.speechSynthesis.getVoices();
        // Browser mein male voices aksar "Google US English Male" ya "Microsoft David" hoti hain
        return voices.find(voice => voice.name.toLowerCase().includes('male')) || voices[0];
    }

    function speakQuestion() {
        const text = quizData[currentCat][qIdx].q;
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.voice = getMaleVoice();
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
    }

    // 4) Speak Result + Answer
    function speakResult(status, answer) {
        const text = status === "Right" ? `Right! Answer is ${answer}` : `Wrong!`;
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.voice = getMaleVoice();
        window.speechSynthesis.speak(utterance);
    }

    function startSpin() {
        if (isSpinning) return;
        isSpinning = true;
        currentRotation += Math.floor(Math.random() * 360) + 1440;
        document.getElementById('wheel').style.transform = `rotate(${currentRotation}deg)`;

        setTimeout(() => {
            isSpinning = false;
            const finalDeg = currentRotation % 360;
            const segmentIdx = Math.floor(((360 - finalDeg) % 360) / 72);
            const selected = quizData[currentCat][qIdx].opts[segmentIdx];
            checkResult(selected);
        }, 3000);
    }

    function checkResult(selected) {
        const qObj = quizData[currentCat][qIdx];
        let status = selected === qObj.a ? "Right" : "Wrong";
        let points = (status === "Right") ? 10 : (selected === "0" ? -5 : 0);
        
        totalScore += points;
        speakResult(status, selected); // 4) Auto right + Answer play

        // 3) Truncate logic for long questions
        const shortQ = qObj.q.length > 15 ? qObj.q.substring(0, 15) + "..." : qObj.q;

        const tbody = document.getElementById('score-history');
        const row = `<tr>
            <td><span class="truncate" title="${qObj.q}">${shortQ}</span></td>
            <td>${selected}</td>
            <td style="color:${status==='Right'?'green':'red'}">${status}</td>
            <td>${totalScore}</td>
        </tr>`;
        tbody.innerHTML = row + tbody.innerHTML;
    }

    function changeCategory(cat) {
        currentCat = cat; qIdx = 0;
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        loadGame();
    }

    function nextQuestion() {
        qIdx = (qIdx + 1) % quizData[currentCat].length;
        loadGame();
    }

    // Voice load hone mein waqt lagta hai isliye ye event zaroori hai
    window.speechSynthesis.onvoiceschanged = loadGame;
    loadGame();
</script>
</body>
</html>

        .question-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 5px 0; }
        .audio-icon { cursor: pointer; font-size: 1.4rem; background: none; border: none; color: var(--gold); }

        .wheel-container { position: relative; width: 220px; height: 220px; margin: 10px auto; }
        #wheel {
            width: 100%; height: 100%; border-radius: 50%; border: 5px solid var(--gold);
            position: relative; overflow: hidden;
            background: conic-gradient(#FFD700 0deg 72deg, #FFA500 72deg 144deg, #FF6347 144deg 216deg, #DA70D6 216deg 288deg, #87CEEB 288deg 360deg);
            transition: transform 3s cubic-bezier(0.1, 0, 0.1, 1);
        }

        .label { position: absolute; width: 100%; height: 100%; text-align: center; font-weight: bold; font-size: 0.9rem; color: #fff; text-shadow: 1px 1px 2px #000; }
        .label:nth-child(1) { transform: rotate(36deg) translateY(12px); }
        .label:nth-child(2) { transform: rotate(108deg) translateY(12px); }
        .label:nth-child(3) { transform: rotate(180deg) translateY(12px); }
        .label:nth-child(4) { transform: rotate(252deg) translateY(12px); }
        .label:nth-child(5) { transform: rotate(324deg) translateY(12px); }

        .marker { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 25px solid var(--gold); z-index: 20; }

        .btn { background: linear-gradient(145deg, #d4af37, #b8860b); color: white; border: none; padding: 10px 25px; border-radius: 50px; font-weight: bold; cursor: pointer; margin: 5px; box-shadow: 0 4px 10px var(--gold-glow); }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 10px var(--gold-glow); }
            50% { box-shadow: 0 0 20px var(--gold); }
        }
        
        .truncate { display: inline-block; max-width: 100px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; vertical-align: middle; }
    </style>
</head>
<body>

    <div class="category-container">
        <div id="cat-watermark" class="watermark">MATH: 0</div>
        <div class="category-menu">
            <button class="cat-btn active" onclick="changeCategory('Math')">Math</button>
            <button class="cat-btn" onclick="changeCategory('GK')">G.K</button>
        <button class="cat-btn" onclick="changeCategory('Tech')">Tech</button>
        </div>
    </div>

    <div class="top-section">
        <div class="final-score-box" id="score-box">
            <h4>Total Score</h4>
            <span id="grand-total">0</span>
        </div>

        <div class="score-table-container" id="scroll-div">
            <table class="score-table">
                <thead>
                    <tr><th>Quest.</th><th>Pick</th><th>Status</th><th>Score</th></tr>
                </thead>
                <tbody id="score-history"></tbody>
            </table>
        </div>
    </div>

    <div class="game-card">
        <div id="q-count" class="q-position">1/2</div>
        <div class="question-row">
            <h2 id="question-box" style="margin:0; font-size: 1rem;">लोड हो रहा है...</h2>
            <button class="audio-icon" onclick="speakQuestion()">🔊</button>
        </div>

        <div class="wheel-container">
            <div class="marker"></div>
            <div id="wheel"></div>
        </div>

        <div class="controls">
            <button class="btn" id="spinBtn" onclick="startSpin()">SPIN</button>
            <button class="btn" style="background:#4CAF50" onclick="nextQuestion()">NEXT</button>
        </div>
        <p id="feedback" style="font-weight: bold; color: var(--gold); margin:5px; font-size: 0.9rem;"></p>
    </div>

<script>
    const quizData = {
        'Math': [
            { q: "55 + 45 कितना होता है?", a: "100", opts: ["100", "90", "0", "80", "70"] },
            { q: "12 * 2 कितना होगा?", a: "24", opts: ["24", "12", "0", "10", "30"] }
        ],
        'GK': [
            { q: "भारत की राजधानी क्या है?", a: "दिल्ली", opts: ["दिल्ली", "मुंबई", "0", "पटना", "गोवा"] }
        ],
        'Tech': [
            { q: "भारत की सबसे लंबी अंतरराष्ट्रीय सीमा किस देश के साथ लगती है?", a: "बांग्लादेश के साथ", opts: ["बांग्लादेश के साथ", "Pak के साथ", "0", "नेपाल के साथ", "श्रीलंका के साथ"] }
        ]
    };

    let currentCat = 'Math';
    let qIdx = 0;
    let totalScore = 0;
    let isSpinning = false;
    let currentRotation = 0;

    function loadGame() {
        const dataList = quizData[currentCat];
        const data = dataList[qIdx];
        document.getElementById('q-count').innerText = `${qIdx + 1} / ${dataList.length}`;
        document.getElementById('cat-watermark').innerText = `${currentCat}: ${dataList.length}`;
        document.getElementById('question-box').innerText = data.q;
        
        const wheel = document.getElementById('wheel');
        wheel.innerHTML = '';
        data.opts.forEach(opt => {
            const div = document.createElement('div');
            div.className = 'label';
            div.innerText = opt;
            wheel.appendChild(div);
        });
    }

    function getMaleVoice() {
        const voices = window.speechSynthesis.getVoices();
        // Priority to Hindi Male, then any Male
        return voices.find(v => v.lang.includes('hi') && v.name.toLowerCase().includes('male')) || 
               voices.find(v => v.name.toLowerCase().includes('male')) || voices[0];
    }

    function speakQuestion() {
        const ut = new SpeechSynthesisUtterance(quizData[currentCat][qIdx].q);
        ut.voice = getMaleVoice();
        ut.lang = 'hi-IN';
        window.speechSynthesis.speak(ut);
    }

    function speakResult(status, answer) {
        const text = status === "Right" ? `सही जवाब! उत्तर है ${answer}` : `गलत जवाब!`;
        const ut = new SpeechSynthesisUtterance(text);
        ut.voice = getMaleVoice();
        ut.lang = 'hi-IN';
        window.speechSynthesis.speak(ut);
    }

    function startSpin() {
        if (isSpinning) return;
        isSpinning = true;
        currentRotation += Math.floor(Math.random() * 360) + 1440;
        document.getElementById('wheel').style.transform = `rotate(${currentRotation}deg)`;

        setTimeout(() => {
            isSpinning = false;
            const finalDeg = currentRotation % 360;
            const segmentIdx = Math.floor(((360 - finalDeg) % 360) / 72);
            const selected = quizData[currentCat][qIdx].opts[segmentIdx];
            checkResult(selected);
        }, 3000);
    }

    function checkResult(selected) {
        const qObj = quizData[currentCat][qIdx];
        let isCorrect = (selected === qObj.a);
        let points = isCorrect ? 10 : (selected === "0" ? -5 : 0);
        
        totalScore += points;
        document.getElementById('grand-total').innerText = totalScore;
        
        // Visual Pop Effect
        const scoreBox = document.getElementById('score-box');
        scoreBox.style.transform = "scale(1.1)";
        setTimeout(() => scoreBox.style.transform = "scale(1)", 200);

        speakResult(isCorrect ? "Right" : "Wrong", selected);

        // Table Update
        const tbody = document.getElementById('score-history');
        const row = document.createElement('tr');
        row.innerHTML = `
            <td><span class="truncate">${qObj.q}</span></td>
            <td>${selected}</td>
            <td style="color:${isCorrect?'green':'red'}"><b>${isCorrect?'Sahi':'Galat'}</b></td>
            <td><b>${points}</b></td>
        `;
        tbody.insertBefore(row, tbody.firstChild); // New row at top

        // Auto Scroll to top of table
        document.getElementById('scroll-div').scrollTop = 0;
    }

    function changeCategory(cat) {
        currentCat = cat; qIdx = 0;
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        loadGame();
    }

    function nextQuestion() {
        qIdx = (qIdx + 1) % quizData[currentCat].length;
        loadGame();
    }

    window.speechSynthesis.onvoiceschanged = loadGame;
    loadGame();
</script>
</body>
</html>
